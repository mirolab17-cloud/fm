<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متحف العائلة</title><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,avatar,fail,shellTitle,db,collection,getDocs}from'./family-pages.js';const S=await boot();async function run(){const all=await members(),main=$('main');main.innerHTML=shellTitle('متحف العائلة','الأرشيف الرقمي الذي يجمع الصور والوثائق والروايات والذكريات.');const counts={صور:all.filter(m=>m.photoUrl||m.photoURL).length,أفراد:all.length,وثائق:0,روايات:0};for(const c of ['familyMedia','familyStories']){try{const s=await getDocs(collection(db,c));if(c==='familyMedia')counts.وثائق=s.docs.filter(d=>(d.data().type||'')==='document').length;else counts.روايات=s.size}catch(e){}}const cards=h('div','museum-grid');main.append(cards);[["📸","أرشيف الصور",`${counts.صور} شخصًا لديهم صور محفوظة`,'archive.html?type=photo'],["📄","الوثائق",`${counts.وثائق} وثيقة في الأرشيف`,'archive.html?type=document'],["🎙️","الروايات",`${counts.روايات} رواية محفوظة`,'archive.html?type=story'],["🕰️","الذكريات","أحداث وذكريات العائلة مع مرور السنين",'events.html']].forEach(x=>{const a=h('a','museum-card');a.href=x[3];a.innerHTML=`<span>${x[0]}</span><h2>${x[1]}</h2><p>${x[2]}</p><b>فتح القسم ←</b>`;cards.append(a)});const gallery=h('section','panel');gallery.innerHTML='<div class="section-head"><div><span class="eyebrow">لمحة</span><h2>صور الأفراد</h2></div><a class="btn" href="archive.html?type=photo">الأرشيف الكامل</a></div><div class="photo-wall" id="wall"></div>';main.append(gallery);const people=all.filter(m=>m.photoUrl||m.photoURL).slice(0,18);if(!people.length)$('#wall').innerHTML='<div class="empty">لم تُرفع صور بعد. ستظهر هنا تلقائيًا عند إضافة الصور إلى ملفات الأشخاص.</div>';else people.forEach(m=>{const a=h('a','photo-tile');a.href='profile.html?id='+m.id;{const u=String(m.photoUrl||m.photoURL||'');const im=h('img');if(/^https:\/\//i.test(u))im.src=u;im.alt='';a.append(im,h('span','',m.fullName||m.firstName||''))}$('#wall').append(a)})}run().catch(fail);
</script></body></html>
