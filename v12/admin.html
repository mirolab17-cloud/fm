<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17233b"><title>إدارة المستخدمين والأجهزة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head><body data-require="admin"><main class="page"><div class="empty">جاري تحميل لوحة الإدارة…</div></main><script type="module">
import{boot,h,$,members,fail,toast,confirmUI,inputUI,db,collection,getDocs,getDoc,doc,setDoc,updateDoc,addDoc,writeBatch,serverTimestamp,increment,collectionGroup,revokeDevice,adminLogoutUser,sendReset,PAGE_LIST}from'./app.js';
const S=await boot();
const ROLES={pending:'بانتظار الموافقة',viewer:'مشاهد',editor:'محرر',admin:'مدير'};
const PAGES=Object.fromEntries(PAGE_LIST);
const cutoff=()=>Date.now()-3*60*1000;
async function idHash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(v||'').replace(/\s/g,'').replace(/[-ـ]/g,'')));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function checks(box,sel){box.replaceChildren();Object.entries(PAGES).forEach(([k,v])=>{const l=h('label','chk',v);l.style.cssText='display:inline-flex;margin:3px;font-size:12px;padding:5px 9px';const c=document.createElement('input');c.type='checkbox';c.value=k;c.checked=sel.includes(k);l.prepend(c);box.append(l)});return()=>[...box.querySelectorAll('input:checked')].map(x=>x.value)}
async function run(){
 const all=await members();
 const users=(await getDocs(collection(db,'users'))).docs.map(d=>({id:d.id,...d.data()}));
 let devices=[],devErr='';
 try{devices=(await getDocs(collectionGroup(db,'devices'))).docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,...d.data()})).sort((a,b)=>(b.lastSeenAt?.toMillis?.()||0)-(a.lastSeenAt?.toMillis?.()||0))}catch(e){devErr=e.code||e.message;console.warn(e)}
 let acc={};try{acc=(await getDoc(doc(db,'settings','access'))).data()||{}}catch(e){}
 const main=$('main');
 main.innerHTML=`<div class="top"><div><span class="eyebrow">لوحة الإدارة والأمان</span><h1>👥 إدارة المستخدمين والأجهزة</h1><p class="mut">راقب الأعضاء، الأجهزة، وطلبات الحسابات، وتحكم بنظام القبول من مكان واحد.</p></div><div class="row"><a class="btn" href="relations.html">👪 ربط الأعضاء</a><a class="btn" href="activity.html">🧾 سجل النشاط</a><a class="btn" href="statistics.html">📊 الإحصائيات</a></div></div>
 <div class="stats"><div class="stat"><b id="totalUsers">0</b><span class="mut">كل الحسابات</span></div><div class="stat"><b id="pendingUsers">0</b><span class="mut">طلبات معلقة</span></div><div class="stat"><b id="activeUsers">0</b><span class="mut">أعضاء نشطون</span></div><div class="stat"><b id="activeDevices">0</b><span class="mut">أجهزة نشطة</span></div></div>
 <div class="admin-tabs"><button class="btn admin-tab active" data-tab="users">👥 الحسابات</button><button class="btn admin-tab" data-tab="access">⚙️ نظام القبول</button><button class="btn admin-tab" data-tab="active">🟢 النشطون</button><button class="btn admin-tab" data-tab="devices">📱 الأجهزة</button></div>
 <section id="usersTab"><div class="panel"><div class="top"><div><h2>الحسابات والطلبات</h2><p class="mut">الموافقة والربط وإدارة الأدوار والصلاحيات.</p></div><div class="row"><select id="st" style="max-width:160px"><option value="">كل الحالات</option><option value="pending">بانتظار الموافقة</option><option value="approved">مقبولون</option><option value="disabled">موقوفون</option></select><input id="q" style="max-width:260px" placeholder="بحث بالاسم أو البريد أو الهوية"></div></div><div id="userCards"></div></div></section>
 <section id="accessTab" hidden><div class="panel"><h2>⚙️ نظام قبول المستخدمين</h2>
  <label class="chk"><input type="checkbox" id="reqApproval"> <b>اشتراط موافقة المدير</b> على الأعضاء الجدد</label>
  <p class="mut">مفعّل: كل تسجيل جديد يكون «بانتظار الموافقة». معطّل: يصبح المسجّل الجديد «مشاهد» مباشرة. يمكنك تبديله متى شئت، ولا يغيّر الحسابات الموجودة إلا إذا ضغطت «اعتماد كل المعلقين».</p>
  <div class="g"><div><label class="l">صفحات يراها من هو بانتظار الموافقة</label><div id="pendPages"></div><p class="mut small">فارغة = لا يرى إلا صفحة «حسابي». تنبيه: السماح بأي صفحة يفتح له قراءة بيانات العائلة.</p></div><div><label class="l">صفحات المشاهدين المقبولين افتراضيًا</label><div id="apprPages"></div><p class="mut small">فارغة = كل الصفحات. صلاحيات المستخدم الخاصة تتفوق عليها. لا تؤثر على المحررين والمديرين.</p></div></div>
  <div class="row" style="margin-top:12px"><button class="btn gold" id="saveAccess">💾 حفظ الإعدادات</button><button class="btn" id="approveAll">✅ اعتماد كل المعلقين الآن</button></div></div></section>
 <section id="activeTab" hidden><div class="panel"><div class="top"><div><h2>🟢 الأعضاء النشطون الآن</h2><p class="mut">يُعتبر العضو نشطًا إذا ظهر جهازه خلال آخر 3 دقائق.</p></div><button class="btn" id="refresh">↻ تحديث</button></div><div id="activeList" class="security-grid"></div></div></section>
 <section id="devicesTab" hidden><div class="panel"><div class="top"><div><h2>📱 إدارة الأجهزة</h2><p class="mut">يمكنك إزالة جهاز، أو تسجيل خروج عضو من جميع أجهزته.</p></div><button class="btn" id="refresh2">↻ تحديث</button></div><div id="deviceList" class="security-grid"></div></div></section>`;
 const userCards=$('#userCards'),activeList=$('#activeList'),deviceList=$('#deviceList');
 const getUser=uid=>users.find(u=>u.id===uid)||{};
 const active=d=>!d.revoked&&((d.lastSeenAt?.toMillis?.()||0)>=cutoff());
 function drawStats(){const au=users.filter(u=>devices.some(d=>d.uid===u.id&&active(d))).length;$('#totalUsers').textContent=users.length;$('#pendingUsers').textContent=users.filter(u=>u.role==='pending').length;$('#activeUsers').textContent=au;$('#activeDevices').textContent=devices.filter(active).length}
 $('#reqApproval').checked=acc.requireApproval!==false;
 const getPend=checks($('#pendPages'),acc.pendingPages||[]),getAppr=checks($('#apprPages'),acc.approvedPages||[]);
 $('#saveAccess').onclick=async()=>{try{await setDoc(doc(db,'settings','access'),{requireApproval:$('#reqApproval').checked,pendingPages:getPend(),approvedPages:getAppr(),updatedAt:serverTimestamp(),updatedBy:S.user.uid},{merge:true});toast('تم حفظ إعدادات القبول ✓')}catch(e){fail(e)}};
 $('#approveAll').onclick=async()=>{const list=users.filter(u=>u.role==='pending'&&!u.disabled);if(!list.length)return toast('لا توجد طلبات معلقة');if(!await confirmUI('اعتماد الكل','سيتم اعتماد '+list.length+' حساب كمشاهدين.'))return;try{for(let i=0;i<list.length;i+=400){const b=writeBatch(db);list.slice(i,i+400).forEach(u=>b.update(doc(db,'users',u.id),{role:'viewer',verificationStatus:'approved',approvedAt:serverTimestamp(),approvedBy:S.user.uid}));await b.commit()}list.forEach(u=>{u.role='viewer';u.verificationStatus='approved'});toast('تم اعتماد '+list.length+' حساب ✓');drawUsers();drawStats()}catch(e){fail(e)}};
 function drawUsers(){
  const q=($('#q').value||'').trim().toLowerCase(),st=$('#st').value;userCards.replaceChildren();
  const list=users.filter(u=>(!q||[u.email,u.displayName,u.idNumber,u.phoneNumber,u.motherName].join(' ').toLowerCase().includes(q))&&(!st||(st==='pending'&&u.role==='pending'&&!u.disabled)||(st==='approved'&&u.role!=='pending'&&!u.disabled)||(st==='disabled'&&u.disabled)));
  if(!list.length){userCards.innerHTML='<div class="security-empty">لا توجد نتائج.</div>';return}
  list.forEach(u=>{
   const wrap=h('div','panel'),activeCount=devices.filter(d=>d.uid===u.id&&active(d)).length,canQuick=u.role==='pending'||u.role==='viewer';
   wrap.innerHTML=`<div class="member-security"><div><b>${esc(u.displayName||'بدون اسم')}</b><div class="mut">${esc(u.email||'—')} · ${esc(u.phoneNumber||'—')}</div><div class="mut small">الأم: ${esc(u.motherName||'—')}</div><div class="presence">${activeCount?'<span class="online-dot"></span> متصل من '+activeCount+' جهاز':'<span class="offline-dot"></span> غير متصل الآن'}</div></div><div><span class="tag ${u.disabled?'no':u.role==='pending'?'':'ok'}">${u.disabled?'موقوف':esc(ROLES[u.role]||'غير معروف')}</span><div class="mut small">آخر دخول: ${u.lastLoginAt?.toDate?u.lastLoginAt.toDate().toLocaleString('ar-EG'):'—'}</div></div><div class="row">${canQuick?`<button class="btn gold quick">${u.role==='pending'?'✅ اعتماد سريع':'⏸ إعادة للانتظار'}</button>`:''}<button class="btn reset-pass">📧 رابط كلمة مرور</button><button class="btn red logout-user">🚪 خروج</button><button class="btn toggle-user">${u.disabled?'تفعيل':'إيقاف'}</button></div></div><div class="g"><div><label class="l">ربط الشخص</label><select class="person"></select></div><div><label class="l">الدور</label><select class="role"></select></div><div><label class="l">الفروع المسموحة</label><input class="branches" placeholder="فرع، فرع آخر" value="${esc((u.branchPermissions||[]).join(', '))}"></div></div><div class="mut small" style="margin-top:8px">صفحات خاصة بهذا المستخدم (فارغة = حسب إعدادات نظام القبول):</div><div class="permissions"></div><div class="row" style="margin-top:10px"><button class="btn gold save-user">حفظ التعديلات</button><button class="btn reject-user">طلب تعديل البيانات</button><a class="btn" href="activity.html">السجل</a></div>`;
   const person=wrap.querySelector('.person');person.add(new Option('— لا يوجد ربط —',''));all.slice().sort((a,b)=>(a.fullName||'').localeCompare(b.fullName||'','ar')).forEach(p=>person.add(new Option(p.fullName||p.firstName,p.id)));person.value=u.personId||'';
   const rs=wrap.querySelector('.role');Object.entries(ROLES).forEach(([k,v])=>rs.add(new Option(v,k)));rs.value=u.role||'pending';
   const pp=wrap.querySelector('.permissions');Object.entries(PAGES).forEach(([k,v])=>{const l=h('label','chk',v);l.style.cssText='display:inline-flex;margin:3px;font-size:11px';const c=document.createElement('input');c.type='checkbox';c.checked=(u.permissions||[]).includes(k);l.prepend(c);c.dataset.page=k;pp.append(l)});
   const q1=wrap.querySelector('.quick');if(q1)q1.onclick=async()=>{try{const toPending=u.role!=='pending';const patch=toPending?{role:'pending',verificationStatus:'pending',approvedAt:null}:{role:'viewer',verificationStatus:'approved',approvedAt:serverTimestamp(),approvedBy:S.user.uid};await updateDoc(doc(db,'users',u.id),patch);u.role=patch.role;u.verificationStatus=patch.verificationStatus;await addDoc(collection(db,'auditLogs'),{type:'user-status-toggle',targetUid:u.id,role:patch.role,by:S.user.uid,at:serverTimestamp()});toast(toPending?'أُعيد الحساب إلى الانتظار':'تم اعتماد الحساب ✓');drawUsers();drawStats()}catch(e){fail(e)}};
   wrap.querySelector('.reset-pass').onclick=async()=>{if(!u.email)return toast('لا يوجد بريد لهذا الحساب');if(!await confirmUI('إرسال رابط كلمة مرور','ستصل رسالة رسمية من Firebase إلى '+u.email+' فيها رابط يختار منه العضو كلمة مروره الجديدة.'))return;try{await sendReset(u.email);await addDoc(collection(db,'auditLogs'),{type:'password-reset-email',targetUid:u.id,by:S.user.uid,at:serverTimestamp()});toast('تم إرسال الرسالة إلى '+u.email+' ✓')}catch(e){fail(e)}};
   wrap.querySelector('.save-user').onclick=async()=>{try{if(rs.value==='admin'&&u.role!=='admin'&&!await confirmUI('تأكيد الصلاحية','هل تريد منح هذا الحساب صلاحية المدير؟'))return;const permissions=[...pp.querySelectorAll('input:checked')].map(x=>x.dataset.page),branches=wrap.querySelector('.branches').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);if(u.idNumber){try{await setDoc(doc(db,'loginIndex',await idHash(u.idNumber)),{uid:u.id,email:u.email,updatedAt:serverTimestamp()},{merge:true})}catch(x){console.warn(x)}}await updateDoc(doc(db,'users',u.id),{role:rs.value,personId:person.value||null,permissions,branchPermissions:branches,verificationStatus:rs.value==='pending'?'pending':'approved',approvedAt:rs.value==='pending'?null:serverTimestamp(),approvedBy:S.user.uid});Object.assign(u,{role:rs.value,personId:person.value||null,permissions,branchPermissions:branches});await addDoc(collection(db,'auditLogs'),{type:'user-permissions-approval',targetUid:u.id,role:rs.value,permissions,branches,by:S.user.uid,at:serverTimestamp()});toast('تم الحفظ ✓');drawUsers();drawStats()}catch(e){fail(e)}};
   wrap.querySelector('.reject-user').onclick=async()=>{const reason=await inputUI('طلب تعديل البيانات','اكتب السبب أو البيانات المطلوبة',u.rejectionReason||'');if(reason===null)return;try{await updateDoc(doc(db,'users',u.id),{role:'pending',verificationStatus:'needs-update',rejectionReason:reason});u.role='pending';u.rejectionReason=reason;toast('تم إرسال طلب التعديل');drawUsers();drawStats()}catch(e){fail(e)}};
   wrap.querySelector('.toggle-user').onclick=async()=>{if(u.id===S.user.uid)return toast('لا يمكنك إيقاف حسابك');try{const next=!u.disabled;await updateDoc(doc(db,'users',u.id),{disabled:next,sessionVersion:increment(1),logoutRequestedAt:serverTimestamp()});u.disabled=next;toast(next?'تم إيقاف الحساب وتسجيل خروجه':'تمت إعادة تفعيل الحساب');drawUsers();drawStats()}catch(e){fail(e)}};
   wrap.querySelector('.logout-user').onclick=async()=>{if(u.id===S.user.uid){toast('لا يمكنك تسجيل خروج نفسك من هذه اللوحة');return}if(!await confirmUI('تسجيل خروج العضو','سيتم تسجيل خروج العضو من جميع الأجهزة المفتوحة لديه.',true))return;try{await adminLogoutUser(u.id);toast('تم طلب تسجيل الخروج من جميع أجهزته ✓');drawUsers()}catch(e){fail(e)}};
   userCards.append(wrap);
  });
 }
 function deviceCard(d){const u=getUser(d.uid),online=active(d),icon=d.type==='mobile'?'📱':d.type==='tablet'?'📲':'💻';const el=h('article','security-card');el.innerHTML=`<div class="device-line"><div class="device-icon">${icon}</div><div class="device-meta"><b>${esc(u.displayName||d.email||'عضو')}</b><small>${esc(d.deviceName||'جهاز غير معروف')}</small><small>${online?'<span class="online-dot"></span> متصل الآن':'<span class="offline-dot"></span> غير متصل'} · ${d.lastSeenAt?.toDate?d.lastSeenAt.toDate().toLocaleString('ar-EG'):'—'}</small></div></div><div class="mut small" style="margin-top:8px">${esc(d.browser||'')} · ${esc(d.platform||'')} · ${esc(d.id.slice(0,8))}</div><div class="device-actions"><button class="btn red revoke">🗑️ إزالة الجهاز</button><button class="btn logout">🚪 خروج العضو</button></div>`;el.querySelector('.revoke').onclick=async()=>{if(!await confirmUI('إزالة الجهاز','سيتم إيقاف جلسة هذا الجهاز فورًا.',true))return;try{await revokeDevice(d.uid,d.id);d.revoked=true;d.active=false;toast('تمت إزالة الجهاز ✓');drawDevices();drawStats()}catch(e){fail(e)}};el.querySelector('.logout').onclick=async()=>{if(!await confirmUI('تسجيل خروج العضو','سيتم تسجيل خروج العضو من جميع أجهزته.',true))return;try{await adminLogoutUser(d.uid);toast('تم تسجيل الخروج من جميع الأجهزة ✓')}catch(e){fail(e)}};return el}
 function drawDevices(){
  const note=devErr?[Object.assign(h('div','err','تعذّرت قراءة الأجهزة ('+devErr+'). انشر ملف firestore.rules المحدّث ثم أعد تحميل الصفحة.'))]:[];
  deviceList.replaceChildren(...note,...devices.filter(d=>!d.revoked).map(deviceCard));if(!devices.filter(d=>!d.revoked).length&&!devErr)deviceList.innerHTML='<div class="security-empty">لا توجد أجهزة مسجلة بعد.</div>';
  activeList.replaceChildren(...devices.filter(active).map(deviceCard));if(!activeList.children.length)activeList.innerHTML='<div class="security-empty">لا يوجد أعضاء نشطون الآن.</div>';drawStats()}
 $('#q').oninput=drawUsers;$('#st').onchange=drawUsers;
 document.querySelectorAll('.admin-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['users','access','active','devices'].forEach(t=>$('#'+t+'Tab').hidden=t!==b.dataset.tab);if(b.dataset.tab==='active'||b.dataset.tab==='devices')drawDevices()});
 $('#refresh').onclick=()=>location.reload();$('#refresh2').onclick=()=>location.reload();drawUsers();drawDevices();
}
run().catch(fail);
</script></body></html>
