<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17233b"><title>التقرير الشهري</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head>
<body data-require="admin"><main class="page"><div class="empty">جاري التحميل…</div></main>
<script type="module">

import { boot, h, $, members, nm, toD, fail, db, collection, getDocs } from "./app.js";
const S = await boot();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TYPES = { "person-create": "إضافة شخص", "person-update": "تعديل بيانات", "relation-link": "ربط علاقات", "external-marriage": "زواج من خارج العائلة", "person-merge": "دمج مكرر", "user-permissions-approval": "اعتماد/تعديل مستخدم", "user-status-toggle": "تبديل حالة مستخدم", "password-reset-email": "رسائل كلمة مرور" };
async function run() {
  const main = $("main"), all = await members(); let users = [], logs = [];
  try { users = (await getDocs(collection(db, "users"))).docs.map((d) => ({ id: d.id, ...d.data() })); } catch (e) {}
  try { logs = (await getDocs(collection(db, "auditLogs"))).docs.map((d) => d.data()); } catch (e) {}
  const now = new Date(), def = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  main.innerHTML = `<div class="top"><div><span class="eyebrow">لوحة المدير</span><h1>📈 التقرير الشهري</h1></div><div class="row"><input id="mo" type="month" value="${def}"><button class="btn" id="pr">🖨️ طباعة / PDF</button></div></div><div id="out"></div>`;
  function draw() {
    const [y, m] = $("#mo").value.split("-").map(Number), inM = (v) => { const d = toD(v); return d && !isNaN(d) && d.getFullYear() === y && d.getMonth() === m - 1; }, nameOf = new Map(users.map((u) => [u.id, u.displayName || u.email || u.id]));
    const added = all.filter((p) => inM(p.createdAt)), births = all.filter((p) => inM(p.birthDate)), deaths = all.filter((p) => p.isAlive === false && inM(p.deathDate)), marr = all.filter((p) => inM(p.marriageDate)), newU = users.filter((u) => inM(u.createdAt));
    const lm = logs.filter((l) => inM(l.at)), byType = {}, byUser = {}; lm.forEach((l) => { byType[l.type] = (byType[l.type] || 0) + 1; if (l.by) byUser[l.by] = (byUser[l.by] || 0) + 1; });
    const lst = (a) => a.length ? a.slice(0, 40).map((p) => `<a class="rel" href="profile.html?id=${p.id}">${esc(nm(p))}</a>`).join(" ") + (a.length > 40 ? " …" : "") : '<span class="mut">—</span>';
    const alive = all.filter((p) => p.isAlive !== false).length, disp = all.filter((p) => p.displaced).length;
    $("#out").innerHTML = `<div class="stats"><div class="stat"><b>${all.length}</b><span class="mut">إجمالي الأفراد</span></div><div class="stat"><b>${alive}</b><span class="mut">الأحياء</span></div><div class="stat"><b>${disp}</b><span class="mut">النازحون</span></div><div class="stat"><b>${added.length}</b><span class="mut">أُضيفوا هذا الشهر</span></div><div class="stat"><b>${births.length}</b><span class="mut">مواليد</span></div><div class="stat"><b>${deaths.length}</b><span class="mut">وفيات</span></div><div class="stat"><b>${marr.length}</b><span class="mut">زيجات</span></div><div class="stat"><b>${newU.length}</b><span class="mut">حسابات جديدة</span></div></div>
    <div class="panel"><h2>👤 أُضيفوا للشجرة</h2>${lst(added)}</div><div class="panel"><h2>👶 المواليد</h2>${lst(births)}</div><div class="panel"><h2>🕊️ الوفيات</h2>${lst(deaths)}</div><div class="panel"><h2>💍 الزيجات</h2>${lst(marr)}</div>
    <div class="panel"><h2>🧾 النشاط (${lm.length} عملية)</h2>${Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="kv"><span>${esc(TYPES[k] || k)}</span><b>${v}</b></div>`).join("") || '<span class="mut">لا نشاط مسجّل.</span>'}</div>
    <div class="panel"><h2>🏆 الأكثر نشاطًا</h2>${Object.entries(byUser).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => `<div class="kv"><span>${esc(nameOf.get(k) || k)}</span><b>${v}</b></div>`).join("") || '<span class="mut">—</span>'}</div>
    <div class="panel"><h2>⏳ طلبات معلقة الآن</h2><b>${users.filter((u) => u.role === "pending").length}</b> حساب بانتظار الموافقة</div>`;
  }
  $("#mo").onchange = draw; $("#pr").onclick = () => print(); draw();
}
run().catch(fail);

</script></body></html>
