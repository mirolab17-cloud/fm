<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>قائمة العائلة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main>
<script type="module">
import { boot, h, $, members, norm, pcard, fail, rank } from "./app.js";
const S = await boot();
async function run() {
  const all = await members(), main = $("main"); main.replaceChildren();
  if (!all.length) {
    const e = h("div", "panel empty"); e.append("لا توجد بيانات بعد. ");
    if (S.role === "admin") { const a = h("a", "", "استيراد البيانات القديمة"); a.href = "admin.html"; e.append(a, " أو "); }
    if (rank[S.role] >= 2) { const a = h("a", "", "أضف أول شخص"); a.href = "add_edit_person.html"; e.append(a); }
    main.appendChild(e); return;
  }
  const n = (f) => all.filter(f).length, st = h("div", "stats");
  [["الإجمالي", all.length], ["أحياء", n((m) => m.isAlive !== false)], ["متوفون", n((m) => m.isAlive === false)], ["ذكور", n((m) => !/^(f|أ)/i.test(m.gender || ""))], ["إناث", n((m) => /^(f|أ)/i.test(m.gender || ""))]].forEach(([k, v]) => { const d = h("div", "stat"); d.append(h("b", "", v), h("span", "mut", k)); st.appendChild(d); });
  const ctl = h("div", "panel ctl");
  ctl.innerHTML = '<input id="q" type="search" placeholder="ابحث بالاسم أو الفئة أو رقم الهوية…" autocomplete="off"><div class="g" style="margin-top:8px"><select id="g"><option value="">كل الأجناس</option><option value="m">ذكور</option><option value="f">إناث</option></select><select id="s"><option value="">كل الحالات</option><option value="a">أحياء</option><option value="d">متوفون</option></select><select id="t"><option value="">كل الفئات</option></select><select id="o"><option value="n">الاسم</option><option value="b">الأكبر سناً</option><option value="y">الأصغر سناً</option></select></div>';
  const tags = new Set(); all.forEach((m) => (m.allTags || m.tags || []).forEach((x) => tags.add(x)));
  [...tags].sort().forEach((x) => $("#t", ctl).add(new Option(x, x)));
  const list = h("div", "grid"), cnt = h("div", "mut"), more = h("button", "btn", "عرض المزيد"); cnt.style.margin = "6px 2px";
  let shown = 60;
  const bd = (m) => (m.birthDate ? (m.birthDate.toMillis ? m.birthDate.toMillis() : +new Date(m.birthDate)) : 9e15);
  function draw() {
    const q = norm($("#q", ctl).value.trim()), g = $("#g", ctl).value, s = $("#s", ctl).value, t = $("#t", ctl).value, o = $("#o", ctl).value;
    let r = all.filter((m) => {
      const f = /^(f|أ)/i.test(m.gender || "");
      return (!q || norm((m.fullName || "") + " " + (m.allTags || m.tags || []).join(" ") + " " + (m.idNumber || "")).includes(q)) && (!g || (g === "f") === f) && (!s || (s === "d") === (m.isAlive === false)) && (!t || (m.allTags || m.tags || []).includes(t));
    });
    r.sort(o === "b" ? (a, b) => bd(a) - bd(b) : o === "y" ? (a, b) => bd(b) - bd(a) : (a, b) => (a.fullName || "").localeCompare(b.fullName || "", "ar"));
    cnt.textContent = `النتائج: ${r.length} من ${all.length}`; list.replaceChildren(...r.slice(0, shown).map(pcard)); more.style.display = r.length > shown ? "" : "none";
  }
  ctl.addEventListener("input", () => { shown = 60; draw(); }); more.onclick = () => { shown += 60; draw(); };
  main.append(st, ctl, cnt, list, more);
  if (rank[S.role] >= 2) { const a = h("a", "fabadd", "＋"); a.href = "add_edit_person.html"; a.setAttribute("aria-label", "إضافة شخص"); document.body.appendChild(a); }
  draw();
}
run().catch(fail);
</script></body></html>
