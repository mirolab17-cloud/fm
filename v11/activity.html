<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل النشاط</title><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head><body data-require="admin"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,h,$,fail,db,collection,getDocs,toD,fmtD}from"./app.js";const S=await boot();async function run(){const [a,l]=await Promise.all([getDocs(collection(db,"auditLogs")),getDocs(collection(db,"loginLogs"))]),logs=[...a.docs.map(d=>({kind:"تعديل",...d.data(),id:d.id})),...l.docs.map(d=>({kind:"دخول",...d.data(),id:d.id}))].sort((x,y)=>(toD(y.at||y.ts)?.getTime()||0)-(toD(x.at||x.ts)?.getTime()||0));const main=$("main");main.innerHTML=`<div class="top"><div><h1>🧾 سجل النشاط</h1><p class="mut">مراجعة عمليات الموافقة وتسجيلات الدخول والأجهزة المستخدمة.</p></div><a class="btn" href="admin.html">العودة للإدارة</a></div><div class="panel"><div class="g"><input id="q" placeholder="بحث بالبريد أو UID أو العملية"><select id="kind"><option value="">كل العمليات</option><option>دخول</option><option>تعديل</option></select><select id="device"><option value="">كل الأجهزة</option><option value="mobile">جوال</option><option value="desktop">كمبيوتر</option></select></div></div><div class="panel tw"><table><thead><tr><th>النوع</th><th>الحساب</th><th>الجهاز والشبكة</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div>`;function draw(){const q=$("#q").value.toLowerCase(),k=$("#kind").value,d=$("#device").value;$("#rows").replaceChildren(...logs.filter(x=>(!k||x.kind===k)&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!d||((x.device||"").toLowerCase().includes(d)))).slice(0,300).map(x=>{const tr=h("tr"),date=x.at||x.ts;tr.append(h("td","",x.kind),h("td","",x.email||x.uid||x.by||"—"),h("td","",[x.device,x.ip,x.userAgent].filter(Boolean).join(" · ")||"—"),h("td","",date?fmtD(date):"—"));return tr}))}$("#q").oninput=draw;$("#kind").onchange=draw;$("#device").onchange=draw;draw()}run().catch(fail);
</script></body></html>
