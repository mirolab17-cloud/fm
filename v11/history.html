<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تاريخ العائلة</title><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,yr,fail,shellTitle}from'./family-pages.js';const S=await boot();async function run(){const all=await members(),main=$('main');main.innerHTML=shellTitle('تاريخ العائلة','مساحة مخصصة لحفظ الحكاية والرواية والأحداث من جيل إلى جيل.');const intro=h('section','panel history-intro');intro.innerHTML='<div class="history-seal">📜</div><div><h2>وثّقوا ما تعرفونه</h2><p>يمكن أن تكون المعلومة رواية عائلية أو وثيقة أو ذكرى. عند توفر بيانات موثقة، اربطوها بالشخص أو السنة أو المكان.</p></div>';main.append(intro);const years={};all.forEach(m=>{const y=yr(m.birthDate);if(y)years[y]=(years[y]||0)+1});const top=Object.entries(years).sort((a,b)=>+a[0]-+b[0]);const timeline=h('section','timeline panel');timeline.innerHTML='<h2>خط زمني للأجيال</h2><p class="mut">هذا الخط يُبنى تلقائيًا من تواريخ الميلاد الموجودة حاليًا.</p><div id="tl"></div>';main.append(timeline);const tl=$('#tl');top.forEach(([y,n])=>{const item=h('article','timeline-item');item.innerHTML=`<div class="timeline-year">${y}</div><div><h3>جيل وُلد في هذه الفترة</h3><p>${n} فرد مسجل بتاريخ ميلاد يبدأ في ${y}.</p><a href="members.html?year=${y}" class="btn">عرض الأشخاص</a></div>`;tl.append(item)});if(!top.length)tl.innerHTML='<p class="empty">أضف تواريخ الميلاد لبناء الخط الزمني تلقائيًا.</p>';const notes=h('section','panel');notes.innerHTML='<h2>محاور مقترحة للتوثيق</h2><div class="quote-grid"><div>🧭 الهجرة والتنقل بين المناطق</div><div>🏡 أماكن السكن القديمة</div><div>👴 روايات الأجداد</div><div>📄 الوثائق والمصادر</div><div>🧳 انتقال الفروع</div><div>🏛️ الشخصيات والمخاتير</div></div>';main.append(notes)}run().catch(fail);
</script></body></html>
