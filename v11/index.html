<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>الرئيسية | سجل العائلة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head><body data-require="viewer"><main class="page"><div class="empty">جاري تحميل بوابة العائلة…</div></main><script type="module">
import{boot,members,h,$,nm,yr,age,branch,stats,shellTitle,metric,cardLink,avatar,pcard,toast,fail}from'./family-pages.js';import{nextBirthdays,browserNotify}from'./fx.js';
const S=await boot();
async function run(){const all=await members(),main=$('main'),st=stats(all);main.innerHTML=shellTitle('بوابة العائلة','مكان واحد يجمع الشجرة، الأشخاص، التاريخ، الصور، الوثائق والذكريات.');
const hero=h('section','dashboard-hero');hero.innerHTML=`<div class="hero-copy"><span class="gold-kicker">حكاية أجدادنا محفوظة للأجيال القادمة</span><h2>من الأسماء إلى الحكاية…</h2><p>استكشف أفراد العائلة وصلات القرابة والفروع والتاريخ والأرشيف من واجهة واحدة.</p><div class="row"><a class="btn gold" href="family_tree.html">🌳 استكشف الشجرة</a><a class="btn" href="members.html">👨‍👩‍👧‍👦 أفراد العائلة</a></div></div><div class="hero-tree"><div class="root-orb">🌳</div><i></i><i></i><i></i></div>`;main.append(hero);
const ms=h('section','stats dashboard-metrics');[["👥","إجمالي الأفراد",st.total,'members.html'],["🟢","الأحياء",st.alive,'members.html?life=alive'],["🕊️","الراحلون",st.dead,'members.html?life=dead'],["♂","الذكور",st.male,'members.html?gender=m'],["♀","الإناث",st.female,'members.html?gender=f'],["🌿","الفروع",st.branches.length,'branches.html']].forEach(x=>ms.append(metric(...x)));main.append(ms);
const sec=h('section','panel');sec.innerHTML='<div class="section-head"><div><span class="eyebrow">استكشف</span><h2>أقسام العائلة</h2></div></div><div class="feature-grid" id="features"></div>';main.append(sec);const f=$('#features');[["🧬","صلة القرابة","اعرف الطريق الذي يربط شخصين داخل الشجرة.","relationship.html"],["📜","تاريخ العائلة","خط زمني للرواية والأحداث والأجيال.","history.html"],["🏛️","متحف العائلة","صور ووثائق وروايات وذكريات في مكان واحد.","museum.html"],["🗺️","أماكن الانتشار","اعرض الفروع والمناطق المرتبطة بالعائلة.","places.html"],["🎂","المناسبات","المواليد وأعياد الميلاد والزيجات والذكريات.","birthdays.html"],["🧩","الفروع","استكشف كل فرع وحده وأفرادَه.","branches.html"],["📊","الإحصائيات","تحليلات عائلية شاملة من بياناتك الحالية.","statistics.html"],["🛠️","جودة البيانات","اكتشف المعلومات الناقصة قبل أن تكبر الشجرة.","data_quality.html"],["🧭","شجرة من منظور شخص","اعرض الأجداد والإخوة والأبناء لأي فرد.","perspective.html"],["🗓️","الاجتماعات","مواعيد اللقاءات وتأكيد الحضور.","meetings.html"],["🗳️","التصويت","استطلاعات رأي العائلة.","votes.html"],["💰","صندوق العائلة","حملات التكافل والمساهمات.","funds.html"],["📁","الوثائق","عقود وشهادات وقرارات.","docs.html"],["💡","اقتراح تصحيح","أبلغ عن خطأ أو معلومة ناقصة.","suggestions.html"],["🔔","التنبيهات","أعياد الميلاد والاجتماعات القريبة.","notifications.html"]].forEach(x=>f.append(cardLink(...x)));
const recent=h('section','panel');recent.innerHTML='<div class="section-head"><div><span class="eyebrow">آخر الإضافات</span><h2>أشخاص جدد</h2></div><a class="btn" href="members.html">عرض الكل</a></div><div class="grid" id="recent"></div>';main.append(recent);const sorted=[...all].sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)).slice(0,8);$('#recent').append(...sorted.map(pcard));
const birthdays=all.map(m=>({m,d:m.birthDate?.toDate?.()})).filter(x=>x.d).sort((a,b)=>{const n=new Date(),aa=new Date(n.getFullYear(),a.d.getMonth(),a.d.getDate()),bb=new Date(n.getFullYear(),b.d.getMonth(),b.d.getDate());return (aa<n?new Date(n.getFullYear()+1,a.d.getMonth(),a.d.getDate()):aa)-(bb<n?new Date(n.getFullYear()+1,b.d.getMonth(),b.d.getDate()):bb)}).slice(0,5);const b=h('section','panel');b.innerHTML='<div class="section-head"><div><span class="eyebrow">قريبًا</span><h2>أعياد الميلاد</h2></div><a class="btn" href="birthdays.html">كل المناسبات</a></div><div class="mini-list" id="bday"></div>';main.append(b);$('#bday').append(...birthdays.map(x=>{const a=h('a','mini-person');a.href='profile.html?id='+x.m.id;a.append(avatar(x.m),h('span','',nm(x.m)),h('small','mut',x.d.toLocaleDateString('ar-EG',{day:'numeric',month:'long'})));return a}));
const bt=nextBirthdays(all,0);if(bt.length){const bn=h('div','panel');bn.style.borderColor='#d4af37';bn.textContent='🎉 أعياد ميلاد اليوم: '+bt.map(x=>nm(x.m)).join('، ');main.prepend(bn);browserNotify('🎂 أعياد ميلاد اليوم',bt.map(x=>nm(x.m)).join('، '),'bday')}
}
run().catch(fail);
</script></body></html>
