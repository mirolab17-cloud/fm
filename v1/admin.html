<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين</title><link rel="stylesheet" href="app.css"></head><body data-require="admin"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import {boot,h,$,members,fail,toast,db,collection,getDocs,doc,updateDoc,addDoc,serverTimestamp} from "./app.js";const S=await boot();
const ROLES={pending:"بانتظار الموافقة",viewer:"مشاهد",editor:"محرر",admin:"مدير"};
async function run(){const all=await members(),main=$("main"),users=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()}));main.innerHTML=`<div class="top"><div><h1>👥 إدارة الأعضاء</h1><p class="mut">راجع طلبات التحقق، اربط الحساب بسجل العائلة، وحدد أقل صلاحية لازمة.</p></div><a class="btn" href="statistics.html">الإحصائيات</a></div><div class="stats"><div class="stat"><b>${users.length}</b><span class="mut">كل الحسابات</span></div><div class="stat"><b>${users.filter(u=>u.role==="pending").length}</b><span class="mut">طلبات معلقة</span></div><div class="stat"><b>${users.filter(u=>u.role==="editor").length}</b><span class="mut">محررون</span></div></div><div class="panel"><div class="top"><h2>طلبات الأعضاء والحسابات</h2><input id="q" style="max-width:280px" placeholder="بحث بالاسم أو البريد أو الهوية"></div><div class="tw"><table><thead><tr><th>البيانات</th><th>التحقق</th><th>ربط بسجل العائلة</th><th>الدور</th><th>حفظ</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="panel"><h2>تنبيه</h2><p class="mut">لا تمنح دور المدير إلا لحساب موثوق. بيانات الهوية لا تظهر للمشاهدين، ويُحفظ كل تغيير في سجل النشاط.</p></div>`;const tb=$("#rows");
function draw(){const q=$("#q").value.trim().toLowerCase();tb.replaceChildren(...users.filter(u=>!q||[u.email,u.displayName,u.idNumber,u.phoneNumber].join(" ").toLowerCase().includes(q)).map(u=>{const tr=h("tr"),data=h("td"),verify=h("td"),link=h("td"),role=h("td"),act=h("td");data.innerHTML=`<b>${u.displayName||"بدون اسم"}</b><div class="mut">${u.email||"—"}<br>${u.phoneNumber||"—"}<br>هوية: ${u.idNumber||"—"}<br>الأم: ${u.motherName||"—"}</div>`;verify.appendChild(h("span","tag "+(u.role==="pending"?"warn":"ok"),u.role==="pending"?"بانتظار المراجعة":"تمت الموافقة"));const sel=h("select");all.slice().sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||"","ar")).forEach(p=>{const o=new Option(p.fullName||p.firstName,p.id);o.selected=p.id===u.personId;sel.add(o)});const none=new Option("— لا يوجد ربط —","");none.selected=!u.personId;sel.prepend(none);link.appendChild(sel);const rs=h("select");Object.entries(ROLES).forEach(([k,v])=>rs.add(new Option(v,k)));rs.value=u.role||"pending";role.appendChild(rs);const b=h("button","btn gold","حفظ");b.onclick=async()=>{try{if(rs.value==="admin"&&!confirm("تأكيد منح صلاحية المدير؟"))return;await updateDoc(doc(db,"users",u.id),{role:rs.value,personId:sel.value||null,verificationStatus:rs.value==="pending"?"pending":"approved",approvedAt:rs.value==="pending"?null:serverTimestamp(),approvedBy:S.user.uid});await addDoc(collection(db,"auditLogs"),{type:"user-approval",targetUid:u.id,role:rs.value,personId:sel.value||null,by:S.user.uid,at:serverTimestamp()});u.role=rs.value;u.personId=sel.value||null;toast("تم حفظ العضو ✓");draw()}catch(e){fail(e)}};act.appendChild(b);tr.append(data,verify,link,role,act);return tr}));}$("#q").oninput=draw;draw()}run().catch(fail);
</script></body></html>
