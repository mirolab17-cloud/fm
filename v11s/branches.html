<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فروع العائلة</title><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="pwa.js" defer></script></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,nm,branch,avatar,fail,shellTitle}from'./family-pages.js';const S=await boot();async function run(){const all=await members(),main=$('main');main.innerHTML=shellTitle('فروع العائلة','استكشف كل فرع بشكل مستقل مع عدد أفراده.');const map=new Map();all.forEach(m=>(m.allTags||m.tags||[]).forEach(t=>map.set(t,(map.get(t)||[]).concat(m))));const box=h('section','branch-grid');main.append(box);const entries=[...map.entries()].sort((a,b)=>b[1].length-a[1].length);if(!entries.length){box.innerHTML='<div class="panel empty">لا توجد فروع مسجلة حاليًا.</div>';return}entries.forEach(([name,people])=>{const c=h('a','branch-card');c.href='members.html?tag='+encodeURIComponent(name);c.innerHTML=`<div class="branch-emblem">🌿</div><div><h2>${name}</h2><p>${people.length} فرد</p></div><span>←</span>`;const pics=h('div','avatar-stack');people.slice(0,5).forEach(m=>pics.append(avatar(m)));c.append(pics);box.append(c)});const no=all.filter(m=>!(m.allTags||m.tags||[]).length);if(no.length){const c=h('div','branch-card muted-card');c.innerHTML=`<div class="branch-emblem">🧩</div><div><h2>بدون فرع</h2><p>${no.length} فرد يحتاج تصنيفًا</p></div>`;box.append(c)}}run().catch(fail);
</script></body></html>
