<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17233b"><title>حسابي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body data-require="none"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,h,$,fail,toast,db,doc,getDoc,updateDoc,sendReset,auth}from"./app.js";
import{EmailAuthProvider,reauthenticateWithCredential,updatePassword}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
const S=await boot();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const split=s=>{const a=String(s||"").trim().split(/\s+/).filter(Boolean);return a.length<=4?[a[0]||"",a[1]||"",a[2]||"",a[3]||""]:[a[0],a[1],a[2],a.slice(3).join(" ")]};
const ERR={"auth/wrong-password":"كلمة المرور الحالية غير صحيحة","auth/invalid-credential":"كلمة المرور الحالية غير صحيحة","auth/weak-password":"كلمة المرور الجديدة ضعيفة (8 أحرف على الأقل)","auth/too-many-requests":"محاولات كثيرة، حاول لاحقًا","auth/requires-recent-login":"أعد تسجيل الدخول ثم حاول مجددًا"};
async function run(){
 const main=$("main");
 if(S.user.isAnonymous){main.innerHTML='<div class="panel">هذه الصفحة للأعضاء المسجلين فقط.</div>';return}
 const ref=doc(db,"users",S.user.uid),p=(await getDoc(ref)).data()||{};
 const np=p.nameParts||split(p.displayName),mp=p.motherParts||split(p.motherName),hasPw=S.user.providerData.some(x=>x.providerId==="password");
 const inp=(id,l,v,extra="")=>`<div><label class="l">${l}</label><input id="${id}" value="${esc(v)}" ${extra}></div>`;
 const pend=p.role==="pending";
 main.innerHTML=`<div class="top"><h1>👤 حسابي</h1><a href="index.html">الرئيسية</a></div>
 <div class="panel"><span class="tag ${pend?"":"ok"}">${pend?"طلبك بانتظار مراجعة المدير":"الحساب مفعّل"}</span>${p.rejectionReason?`<p class="err">ملاحظة الإدارة: ${esc(p.rejectionReason)}</p>`:""}<p class="mut">${esc(S.user.email||"")}</p>
 <form id="f"><p class="l">الاسم الرباعي</p><div class="name4">${inp("n1","الاسم الأول",np[0])}${inp("n2","اسم الأب",np[1])}${inp("n3","اسم الجد",np[2])}${inp("n4","اسم العائلة",np[3])}</div>
 <p class="l" style="margin-top:12px">اسم الأم الرباعي</p><div class="name4">${inp("m1","اسم الأم",mp[0])}${inp("m2","اسم أب الأم",mp[1])}${inp("m3","اسم جد الأم",mp[2])}${inp("m4","عائلة الأم",mp[3])}</div>
 <div class="g" style="margin-top:12px">${inp("ph","رقم الجوال",p.phoneNumber,'dir="ltr" inputmode="numeric" maxlength="10"')}${inp("bd","تاريخ الميلاد",p.birthDate,'type="date"')}${inp("idn","رقم الهوية",p.idNumber,'dir="ltr"'+(p.idNumber?" readonly":""))}</div>
 ${p.idNumber?'<p class="mut small">رقم الهوية مقفل. اطلب من المدير تعديله عند الحاجة.</p>':""}
 <button class="btn gold" type="submit" style="margin-top:12px">💾 حفظ البيانات</button></form></div>
 <div class="panel"><h2>🔑 كلمة المرور</h2>${hasPw?`<form id="pf" class="g"><div><label class="l">كلمة المرور الحالية</label><input id="cur" type="password" dir="ltr" autocomplete="current-password"></div><div><label class="l">كلمة المرور الجديدة</label><input id="nw" type="password" dir="ltr" autocomplete="new-password"></div><div><label class="l">تأكيد الجديدة</label><input id="nw2" type="password" dir="ltr" autocomplete="new-password"></div><div style="align-self:end"><button class="btn gold" type="submit">تغيير كلمة المرور</button></div></form>`:'<p class="mut">حسابك مرتبط بـ Google. يمكنك إنشاء كلمة مرور للموقع عبر الرابط أدناه.</p>'}
 <div class="row" style="margin-top:10px"><button class="btn" id="mail">📧 أرسل لي رابط كلمة مرور جديدة إلى بريدي</button></div></div>`;
 $("#f").onsubmit=async e=>{e.preventDefault();try{
  const n=[1,2,3,4].map(i=>$("#n"+i).value.trim().replace(/\s+/g," ")),m=[1,2,3,4].map(i=>$("#m"+i).value.trim().replace(/\s+/g," "));
  if(n.some(x=>x.length<2))throw Error("اكتب الاسم الرباعي: كل اسم في خانته");
  if(m.some(x=>x.length<2))throw Error("اكتب اسم الأم الرباعي: كل اسم في خانته");
  const ph=$("#ph").value.trim();if(!/^05\d{8}$/.test(ph))throw Error("رقم الجوال يجب أن يكون 10 أرقام ويبدأ بـ 05");
  const d={displayName:n.join(" "),nameParts:n,motherName:m.join(" "),motherParts:m,phoneNumber:ph,birthDate:$("#bd").value};
  if(!p.idNumber&&$("#idn").value.trim())d.idNumber=$("#idn").value.replace(/[\s-]/g,"");
  await updateDoc(ref,d);toast("تم حفظ بياناتك ✓");
 }catch(x){x.code?fail(x):toast(x.message)}};
 if(hasPw)$("#pf").onsubmit=async e=>{e.preventDefault();try{
  const cur=$("#cur").value,nw=$("#nw").value;
  if(!cur)throw Error("اكتب كلمة المرور الحالية");if(nw.length<8)throw Error("كلمة المرور الجديدة 8 أحرف على الأقل");if(nw!==$("#nw2").value)throw Error("كلمتا المرور الجديدتان غير متطابقتين");
  await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(S.user.email,cur));await updatePassword(auth.currentUser,nw);
  $("#pf").reset();toast("تم تغيير كلمة المرور ✓");
 }catch(x){toast(ERR[x.code]||x.message)}};
 $("#mail").onclick=async()=>{try{await sendReset(S.user.email);toast("أُرسلت رسالة إلى "+S.user.email+" (افحص البريد المزعج أيضًا)")}catch(x){toast(ERR[x.code]||x.code||x.message)}};
}
run().catch(fail);
</script></body></html>
