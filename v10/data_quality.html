<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جودة البيانات</title><link rel="stylesheet" href="app.css"></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,nm,pcard,fail,shellTitle}from'./family-pages.js';const S=await boot();async function run(){const all=await members(),main=$('main');main.innerHTML=shellTitle('مركز جودة البيانات','اكتشف النواقص والتعارضات قبل أن تكبر الشجرة.');const checks=[['تاريخ الميلاد',m=>!m.birthDate,'birthDate'],['الأب',m=>!m.fatherId&&!m.fatherName,'father'],['الأم',m=>!m.motherId&&!m.motherName,'mother'],['الجنس',m=>!m.gender,'gender'],['الصورة',m=>!m.photoUrl&&!m.photoURL,'photo'],['الفرع',m=>(!(m.allTags||m.tags||[]).length),'branch']];const cards=h('div','stats');main.append(cards);checks.forEach(([label,fn])=>{const n=all.filter(fn).length;const c=h('div','stat');c.innerHTML=`<span class="stat-icon">${n?'⚠️':'✅'}</span><b>${n}</b><span class="mut">${label} ناقص</span>`;cards.append(c)});const panel=h('section','panel');panel.innerHTML='<div class="section-head"><div><span class="eyebrow">مراجعة</span><h2>أشخاص يحتاجون بيانات</h2></div><button class="btn" id="filter">عرض النواقص فقط</button></div><div class="grid" id="people"></div>';main.append(panel);function draw(only=false){const r=only?all.filter(m=>checks.some(([,fn])=>fn(m))):all.slice(0,20);$('#people').replaceChildren(...r.map(pcard))}$('#filter').onclick=()=>draw(true);draw(false)}run().catch(fail);
</script></body></html>
