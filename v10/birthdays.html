<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المناسبات وأعياد الميلاد</title><link rel="stylesheet" href="app.css"></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,nm,avatar,fail,shellTitle}from'./family-pages.js';const S=await boot();async function run(){const all=await members(),main=$('main'),now=new Date();main.innerHTML=shellTitle('المناسبات العائلية','أعياد الميلاد والزيجات والذكريات مرتبة من الأقرب إلى الأبعد.');const upcoming=all.map(m=>({m,d:m.birthDate?.toDate?.()})).filter(x=>x.d).map(x=>{let d=new Date(now.getFullYear(),x.d.getMonth(),x.d.getDate());if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(now.getFullYear()+1);return {...x,next:d}}).sort((a,b)=>a.next-b.next);const box=h('section','panel');box.innerHTML='<div class="section-head"><div><span class="eyebrow">🎂 45 يومًا قادمة</span><h2>أعياد الميلاد</h2></div></div><div class="event-list" id="list"></div>';main.append(box);const list=$('#list');upcoming.slice(0,30).forEach(x=>{const a=h('a','event-card');a.href='profile.html?id='+x.m.id;const info=h('div','event-info');info.append(h('b','',nm(x.m)),h('span','',x.next.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})));a.append(avatar(x.m),info);list.append(a)});if(!upcoming.length)list.innerHTML='<div class="empty">لا توجد تواريخ ميلاد مسجلة.</div>';const other=h('section','quote-grid');main.append(other);[["💍","الزيجات","تعتمد على حقل تاريخ الزواج إن كان موجودًا."],["👶","المواليد","أحدث المواليد يمكن الوصول إليهم من قائمة العائلة."],["🕊️","الذكريات","الأحداث الموجودة في صفحة الأحداث تبقى جزءًا من أرشيف العائلة."]].forEach(x=>{const c=h('div','quote-card');c.innerHTML=`<span>${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p>`;other.append(c)})}run().catch(fail);
</script></body></html>
