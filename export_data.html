<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>تصدير البيانات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body data-require="editor"><main class="page"><div class="empty">جاري التحميل…</div></main>
<script type="module">
import { boot, h, $, members, toD, iso, fail, toast } from "./app.js";
const S = await boot();
const COLS = [["fullName", "الاسم الكامل", 1], ["firstName", "الاسم الأول", 1], ["fatherName", "اسم الأب", 1], ["grandFatherName", "اسم الجد", 1], ["familyName", "العائلة", 1], ["motherName", "اسم الأم", 0], ["gender", "الجنس", 1], ["birthDate", "تاريخ الميلاد", 1], ["isAlive", "على قيد الحياة", 1], ["deathDate", "تاريخ الوفاة", 1], ["maritalStatus", "الحالة الاجتماعية", 1], ["phoneNumber", "الجوال", 1], ["idNumber", "رقم الهوية", 0], ["tags", "الفئة المباشرة", 1], ["allTags", "الفئات (مع الموروثة)", 1], ["notes", "ملاحظات", 0]];
const MS = { Single: "أعزب/عزباء", Married: "متزوج/ة", Divorced: "مطلق/ة", Widowed: "أرمل/ة" };
function fmt(m, k) {
  const v = m[k]; if (k === "isAlive") return m.isAlive === false ? "لا" : "نعم"; if (v == null) return "";
  if (k === "gender") return /^(f|أ)/i.test(v) ? "أنثى" : "ذكر"; if (k === "maritalStatus") return MS[v] || v;
  if (k === "birthDate" || k === "deathDate") return iso(v); if (Array.isArray(v)) return v.join("؛"); return String(v);
}
async function run() {
  const all = await members(), main = $("main");
  main.innerHTML = '<div class="top"><h1>📤 تصدير البيانات</h1></div><div class="panel"><h2>الأعمدة</h2><div class="g" id="cols"></div></div><div class="panel"><h2>التصفية</h2><div class="g"><select id="t"><option value="">كل الفئات</option></select><select id="g"><option value="">كل الأجناس</option><option value="m">ذكور</option><option value="f">إناث</option></select><select id="s"><option value="">كل الحالات</option><option value="a">أحياء</option><option value="d">متوفون</option></select></div><p class="mut" id="cnt"></p></div><div class="row"><button class="btn gold" id="csv">تصدير Excel / CSV</button><button class="btn" id="json">تصدير JSON</button></div>';
  COLS.forEach(([k, l, on]) => { const lb = h("label", "chk"), c = h("input"); c.type = "checkbox"; c.value = k; c.checked = !!on; lb.append(c, l); $("#cols").appendChild(lb); });
  const tags = new Set(); all.forEach((m) => (m.allTags || m.tags || []).forEach((x) => tags.add(x))); [...tags].sort().forEach((x) => $("#t").add(new Option(x, x)));
  const rows = () => { const t = $("#t").value, g = $("#g").value, s = $("#s").value; return all.filter((m) => (!t || (m.allTags || m.tags || []).includes(t)) && (!g || (g === "f") === /^(f|أ)/i.test(m.gender || "")) && (!s || (s === "d") === (m.isAlive === false))); };
  const sel = () => COLS.filter(([k]) => $("#cols").querySelector(`input[value="${k}"]`).checked);
  const upd = () => ($("#cnt").textContent = `عدد السجلات المطابقة: ${rows().length} من ${all.length}`); main.addEventListener("input", upd); upd();
  const save = (name, type, text) => { const a = h("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name + "-" + new Date().toISOString().slice(0, 10); a.click(); };
  $("#csv").onclick = () => { const c = sel(), r = rows(); if (!c.length || !r.length) return toast("لا توجد أعمدة أو سجلات"); const q = (s) => '"' + String(s).replace(/"/g, '""') + '"'; save("family.csv", "text/csv;charset=utf-8", "\uFEFF" + [c.map((x) => q(x[1])).join(","), ...r.map((m) => c.map((x) => q(fmt(m, x[0]))).join(","))].join("\r\n")); };
  $("#json").onclick = () => { const c = sel(), r = rows(); if (!c.length || !r.length) return toast("لا توجد أعمدة أو سجلات"); save("family.json", "application/json", JSON.stringify(r.map((m) => Object.fromEntries(c.map((x) => [x[0], fmt(m, x[0])]))), null, 2)); };
}
run().catch(fail);
</script></body></html>
