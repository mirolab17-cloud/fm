import{boot,h,$,members,norm,pcard,fail,rank,toast}from"./app.js";const S=await boot();async function run(){const all=await members(),main=$("main");if(!all.length){main.innerHTML='<div class="panel empty">لا توجد بيانات بعد.</div>';return}const years=[...new Set(all.map(m=>m.birthDate?.toDate?.().getFullYear()).filter(Boolean))].sort((a,b)=>b-a),tags=[...new Set(all.flatMap(m=>m.allTags||m.tags||[]))].sort();main.innerHTML=`<div class="top"><div><h1>🏠 قائمة العائلة</h1><p class="mut">ابحث وفلتر واعرض أفراد العائلة بالطريقة المناسبة.</p></div><div class="row"><button class="btn" id="dark">الوضع الداكن</button><button class="btn" id="print">طباعة</button><button class="btn" id="csv">تصدير النتائج</button></div></div><div class="stats" id="stats"></div><div class="panel ctl"><input id="q" type="search" placeholder="ابحث بالاسم أو الأب أو الأم أو الفرع…" autocomplete="off"><div class="g" style="margin-top:10px"><select id="gender"><option value="">كل الأجناس</option><option value="m">ذكور</option><option value="f">إناث</option></select><select id="life"><option value="">كل الحالات</option><option value="alive">أحياء</option><option value="dead">متوفون</option><option value="missing">بيانات ناقصة</option></select><select id="tag"><option value="">كل الفروع والفئات</option>${tags.map(x=>`<option>${x}</option>`).join("")}</select><select id="year"><option value="">كل سنوات الميلاد</option>${years.map(x=>`<option>${x}</option>`).join("")}</select><select id="marital"><option value="">كل الحالات الاجتماعية</option><option value="Single">أعزب/عزباء</option><option value="Married">متزوج/ة</option><option value="Divorced">مطلق/ة</option><option value="Widowed">أرمل/ة</option></select><select id="sort"><option value="name">الاسم</option><option value="old">الأكبر سنًا</option><option value="young">الأصغر سنًا</option><option value="new">الأحدث إضافة</option></select><select id="view"><option value="grid">بطاقات</option><option value="table">جدول</option></select></div><div class="row" style="margin-top:10px"><label class="chk"><input id="incomplete" type="checkbox"> ناقصو البيانات فقط</label><label class="chk"><input id="birthdays" type="checkbox"> أعياد الميلاد القريبة</label></div></div><div class="row"><span id="count" class="mut"></span><button id="selectAll" class="btn">تحديد الكل</button><button id="clear" class="btn">مسح الفلاتر</button></div><div id="results" class="grid"></div><div id="table" class="panel tw" hidden></div><button id="more" class="btn" style="display:none;margin:16px auto">عرض المزيد</button>`;const ids=["q","gender","life","tag","year","marital","sort","view","incomplete","birthdays"],get=id=>$("#"+id),key="family-filters";try{const saved=JSON.parse(localStorage.getItem(key)||"{}");ids.forEach(id=>{if(saved[id]!==undefined){if(get(id).type==="checkbox")get(id).checked=saved[id];else get(id).value=saved[id]}})}catch(e){}let shown=60;function age(m){const d=m.birthDate?.toDate?.();return d?Math.floor((Date.now()-d.getTime())/31557600000):null}function birthday(m){const d=m.birthDate?.toDate?.();if(!d)return false;const now=new Date(),x=new Date(now.getFullYear(),d.getMonth(),d.getDate());return x>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&x<=new Date(now.getFullYear(),now.getMonth(),now.getDate()+45)}function filtered(){const q=norm(get("q").value),g=get("gender").value,l=get("life").value,t=get("tag").value,y=get("year").value,ms=get("marital").value;let r=all.filter(m=>{const f=/^(f|أ)/i.test(m.gender||""),missing=!m.fatherId&&!m.motherId||!m.birthDate;return(!q||norm([m.fullName,m.fatherName,m.motherName,(m.allTags||[]).join(" ")].join(" ")).includes(q))&&(!g||(g==="f")===f)&&(!l||(l==="alive"?m.isAlive!==false:l==="dead"?m.isAlive===false:missing))&&(!t||(m.allTags||m.tags||[]).includes(t))&&(!y||m.birthDate?.toDate?.().getFullYear()==y)&&(!ms||m.maritalStatus===ms)&&(!get("incomplete").checked||missing)&&(!get("birthdays").checked||birthday(m))});const s=get("sort").value;r.sort(s==="old"?(a,b)=>(a.birthDate?.toMillis?.()||Date.now())-(b.birthDate?.toMillis?.()||Date.now()):s==="young"?(a,b)=>(b.birthDate?.toMillis?.()||0)-(a.birthDate?.toMillis?.()||0):s==="new"?(a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0):(a,b)=>(a.fullName||"").localeCompare(b.fullName||"","ar"));return r}function draw(){const r=filtered(),f={};ids.forEach(id=>f[id]=get(id).type==="checkbox"?get(id).checked:get(id).value);localStorage.setItem(key,JSON.stringify(f));const st=$("#stats");st.replaceChildren(...[["النتائج",r.length],["الأحياء",r.filter(m=>m.isAlive!==false).length],["المتوفون",r.filter(m=>m.isAlive===false).length],["الناقصون",r.filter(m=>!m.birthDate||(!m.fatherId&&!m.motherId)).length]].map(([k,v])=>{const x=h("div","stat");x.append(h("b","",v),h("span","mut",k));return x}));$("#count").textContent=`عرض ${Math.min(shown,r.length)} من ${r.length}`;const checks=r.slice(0,shown).map(m=>{const a=pcard(m);const c=document.createElement("input");c.type="checkbox";c.dataset.id=m.id;c.className="pick";a.prepend(c);return a});$("#results").replaceChildren(...checks);$("#more").style.display=r.length>shown?"block":"none";const tb=$("#table");tb.hidden=get("view").value!=="table";$("#results").hidden=!tb.hidden;if(!tb.hidden)tb.innerHTML='<table><thead><tr><th>تحديد</th><th>الاسم</th><th>الجنس</th><th>العمر</th><th>الحالة</th><th>الفرع</th></tr></thead><tbody>'+r.slice(0,shown).map(m=>`<tr><td><input class="pick" type="checkbox" data-id="${m.id}"></td><td><a href="profile.html?id=${m.id}">${m.fullName||m.firstName}</a></td><td>${/^(f|أ)/i.test(m.gender||"")?'أنثى':'ذكر'}</td><td>${age(m)||'—'}</td><td>${m.isAlive===false?'متوفى':'حي'}</td><td>${(m.allTags||[]).join('، ')}</td></tr>`).join('')+'</tbody></table>'}ids.forEach(id=>get(id).addEventListener("input",()=>{shown=60;draw()}));$("#more").onclick=()=>{shown+=60;draw()};$("#clear").onclick=()=>{ids.forEach(id=>get(id).type==="checkbox"?get(id).checked=false:get(id).value="");shown=60;draw()};$("#selectAl
