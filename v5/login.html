<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2ea"><title>تسجيل الدخول | شجرة العائلة</title><link rel="stylesheet" href="app.css"></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-hero"><div class="brand-mark">🌳</div><p class="eyebrow">منصة العائلة الآمنة</p><h1>شجرة العائلة</h1><p>احفظ صلة الرحم والذكريات في مكان واحد، مع تحكم واضح بالخصوصية والصلاحيات.</p><div class="auth-points"><span>✓ بيانات منظمة</span><span>✓ موافقة المدير</span><span>✓ دخول آمن</span></div></section><section class="panel auth-card"><div class="tabs"><button class="tab active" id="loginTab">تسجيل الدخول</button><button class="tab" id="registerTab">إنشاء حساب</button></div><form id="authForm" novalidate><div id="registerFields" class="g" hidden><div><label class="l">الاسم الرباعي *</label><input id="name" autocomplete="name" placeholder="الاسم الأول الأب الجد العائلة"></div><div><label class="l">رقم الجوال *</label><input id="phone" inputmode="numeric" dir="ltr" placeholder="05xxxxxxxx" maxlength="10"></div><div><label class="l">تاريخ الميلاد *</label><input id="birthDate" type="date"></div><div><label class="l">رقم الهوية *</label><input id="idNumber" inputmode="numeric" dir="ltr" placeholder="رقم الهوية"></div><div><label class="l">اسم الأم الرباعي *</label><input id="motherName" placeholder="اسم الأم الرباعي"></div></div><label class="l">البريد الإلكتروني أو رقم الهوية *</label><input id="email" type="text" required dir="ltr" autocomplete="username" placeholder="البريد الإلكتروني أو رقم الهوية"><label class="l">كلمة المرور *</label><input id="password" type="password" required dir="ltr" autocomplete="current-password" placeholder="8 أحرف على الأقل"><div id="confirmWrap" hidden><label class="l">تأكيد كلمة المرور *</label><input id="confirm" type="password" dir="ltr" autocomplete="new-password"></div><label id="privacyWrap" class="chk" hidden><input id="privacyConsent" type="checkbox"> أوافق على <a href="privacy.html" target="_blank">سياسة الخصوصية</a></label><button class="btn gold auth-submit" id="submit" type="submit">دخول</button></form><button class="btn google" id="google">G&nbsp;&nbsp; المتابعة باستخدام Google</button><button class="text-btn" id="forgot" type="button">إرسال رابط تغيير كلمة المرور</button><p id="message" class="form-message" role="alert"></p><p class="mut small">عند إنشاء حساب، يراجع المدير بياناتك ويربطها بسجل العائلة قبل إتاحة المحتوى.</p></section></main><script type="module">
import { auth, db, doc, getDoc, setDoc, addDoc, collection, serverTimestamp } from "./lib.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
const $=id=>document.getElementById(id); let mode="login"; const next=new URLSearchParams(location.search).get("next"); const safeNext=/^[\w.-]+\.html(\?[\w=&%.-]*)?$/.test(next||"")?next:"index.html";
const errors={"auth/invalid-credential":"البريد/الهوية أو كلمة المرور غير صحيحة","auth/wrong-password":"البريد/الهوية أو كلمة المرور غير صحيحة","auth/user-not-found":"لا يوجد حساب مرتبط بهذه البيانات","auth/email-already-in-use":"البريد مستخدم من قبل","auth/weak-password":"استخدم كلمة مرور من 8 أحرف على الأقل","auth/invalid-email":"البريد غير صالح","auth/operation-not-allowed":"فعّل Email/Password وGoogle من Firebase Console","auth/popup-closed-by-user":"أغلقت نافذة Google قبل الإكمال","auth/network-request-failed":"تحقق من اتصال الإنترنت"};
function message(t,ok=false){$("message").textContent=t;$("message").className="form-message "+(ok?"ok":"error")}
function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("registerTab").classList.toggle("active",m==="register");$("registerFields").hidden=m!=="register";$("confirmWrap").hidden=m!=="register";$("privacyWrap").hidden=m!=="register";$("forgot").hidden=m!=="login";$("submit").textContent=m==="login"?"دخول":"إنشاء الحساب";message("")}
$("loginTab").onclick=()=>setMode("login");$("registerTab").onclick=()=>setMode("register");
function normalizeId(v){return String(v||"").replace(/\s/g,"").replace(/[-ـ]/g,"").trim()}
async function idHash(v){const bytes=new TextEncoder().encode(normalizeId(v)),buf=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function resolveEmail(identifier){const value=identifier.trim();if(value.includes("@"))return value; if(!/^\d{8,15}$/.test(normalizeId(value)))throw Error("اكتب بريدًا صحيحًا أو رقم هوية من 8 إلى 15 رقمًا");const snap=await getDoc(doc(db,"loginIndex",await idHash(value)));if(!snap.exists())throw Error("لا يوجد حساب مرتبط برقم الهوية");return snap.data().email}
function validate(){if(mode==="login")return true; const phone=$("phone").value.trim(),name=$("name").value.trim(),id=normalizeId($("idNumber").value);if(name.split(/\s+/).length<4)throw Error("اكتب الاسم رباعياً");if(!/^05\d{8}$/.test(phone))throw Error("رقم الجوال يجب أن يكون 10 أرقام ويبدأ بـ 05");if(!/^\d{8,15}$/.test(id))throw Error("رقم الهوية غير صالح");if($("password").value.length<8)throw Error("كلمة المرور يجب أن تكون 8 أحرف على الأقل");if($("password").value!==$("confirm").value)throw Error("كلمتا المرور غير متطابقتين");if(!$("privacyConsent").checked)throw Error("يجب الموافقة على سياسة الخصوصية");return true}
async function saveProfile(u,extra={}){const id=normalizeId($("idNumber").value),profile={email:u.email||"",displayName:u.displayName||$("name").value.trim(),phoneNumber:$("phone").value.trim()||null,birthDate:$("birthDate").value||null,idNumber:id||null,motherName:$("motherName").value.trim()||null,verificationStatus:mode==="register"?"pending":"profile-incomplete",role:"pending",permissions:[],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),...extra};await setDoc(doc(db,"users",u.uid),profile,{merge:true});if(id)await setDoc(doc(db,"loginIndex",await idHash(id)),{uid:u.uid,email:u.email,updatedAt:serverTimestamp()},{merge:true});if(mode==="register")await setDoc(doc(db,"verificationRequests",u.uid),{uid:u.uid,...profile,status:"pending",submittedAt:serverTimestamp()},{merge:true})}
$("authForm").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{validate();let u;if(mode==="login"){const email=await resolveEmail($("email").value);u=(await signInWithEmailAndPassword(auth,email,$("password").value)).user;await setDoc(doc(db,"users",u.uid),{lastLoginAt:serverTimestamp()},{merge:true});await addDoc(collection(db,"loginLogs"),{uid:u.uid,email:u.email,loginMethod:$("email").value.includes("@")?"email":"idNumber",device:/Mobi|Android/i.test(navigator.userAgent)?"mobile":"desktop",userAgent:navigator.userAgent.slice(0,180),at:serverTimestamp()})}else{u=(await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)).user;await updateProfile(u,{displayName:$("name").value.trim()});await saveProfile(u)}location.replace(safeNext)}catch(e){message(errors[e.code]||e.message||"تعذر إتمام العملية")}finally{$("submit").disabled=false}};
$("google").onclick=async()=>{try{$("google").disabled=true;const u=(await signInWithPopup(auth,new GoogleAuthProvider())).user;if(!$(("name")).value.trim()){setMode("register");$("name").value=u.displayName||"";$("email").value=u.email||"";message("أكمل رقم الجوال والهوية واسم الأم لإرسال طلبك",false);return}validate();await saveProfile(u,{displayName:$("name").value.trim()});location.replace(safeNext)}catch(e){message(errors[e.code]||e.message||"تعذر تسجيل الدخول بواسطة Google")}finally{$("google").disabled=false}};
$("forgot").onclick=async()=>{const b=$("forgot");try{b.disabled=true;const identifier=$("email").value.trim();if(!identifier)throw Error("اكتب البريد الإلكتروني أو رقم الهوية أولاً");const email=await resolveEmail(identifier);await sendPasswordResetEmail(auth,email);message("تم إرسال رابط إعادة تعيين كلمة المرور إلى البريد المرتبط بالحساب",true)}catch(e){message(errors[e.code]||e.message||"تعذر إرسال رابط إعادة التعيين")}finally{b.disabled=false}};
</script></body></html>
