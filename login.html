<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>تسجيل الدخول</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body><main class="page" style="max-width:420px;padding-top:9vh"><div class="panel" style="text-align:center"><div style="font-size:44px">🌳</div><h1 style="color:#d4af37;margin:4px 0">شجرة العائلة</h1><p class="mut">سجّل الدخول للمتابعة. أول حساب يُنشأ يصبح مدير الموقع.</p>
<div class="g" style="grid-template-columns:1fr;margin-top:12px"><input id="e" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور (6 أحرف فأكثر)" dir="ltr" autocomplete="current-password"><button class="btn gold" id="li">دخول</button><button class="btn" id="re">إنشاء حساب جديد</button><button class="btn" id="fg" style="background:none;border:0">نسيت كلمة المرور</button></div><p id="m" style="color:#fca5a5;min-height:22px"></p></div></main>
<script type="module">
import { auth } from "./lib.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
const $ = (i) => document.getElementById(i), nx = new URLSearchParams(location.search).get("next") || "", next = /^[\w.-]+\.html(\?[\w=&%.-]*)?$/.test(nx) ? nx : "index.html";
const E = { "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة", "auth/email-already-in-use": "البريد مستخدم من قبل، سجّل الدخول", "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل)", "auth/invalid-email": "البريد غير صالح", "auth/operation-not-allowed": "فعّل Email/Password من Firebase Console ← Authentication", "auth/network-request-failed": "لا يوجد اتصال بالإنترنت" };
onAuthStateChanged(auth, (u) => { if (u && !u.isAnonymous) location.replace(next); });
const run = (fn) => async () => { $("m").textContent = ""; document.querySelectorAll(".btn").forEach((b) => (b.disabled = true)); try { await fn(); } catch (e) { $("m").style.color = "#fca5a5"; $("m").textContent = E[e.code] || e.message; } document.querySelectorAll(".btn").forEach((b) => (b.disabled = false)); };
$("li").onclick = run(() => signInWithEmailAndPassword(auth, $("e").value.trim(), $("p").value));
$("re").onclick = run(() => createUserWithEmailAndPassword(auth, $("e").value.trim(), $("p").value));
$("fg").onclick = run(async () => { await sendPasswordResetEmail(auth, $("e").value.trim()); $("m").style.color = "#86efac"; $("m").textContent = "أُرسل رابط الاستعادة إلى بريدك"; });
$("p").addEventListener("keydown", (e) => { if (e.key === "Enter") $("li").click(); });
</script></body></html>
