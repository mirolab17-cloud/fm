<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - شجرة العائلة</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-xl shadow p-6 w-full max-w-sm space-y-3">
<h1 class="text-xl font-bold text-center">شجرة العائلة</h1>
<input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full border rounded p-2" dir="ltr">
<input id="pass" type="password" placeholder="كلمة المرور (6 أحرف فأكثر)" class="w-full border rounded p-2" dir="ltr">
<button id="login" class="w-full bg-blue-600 text-white rounded p-2">دخول</button>
<button id="register" class="w-full bg-gray-200 rounded p-2">إنشاء حساب جديد</button>
<button id="reset" class="w-full text-sm text-blue-600">نسيت كلمة المرور</button>
<p id="msg" class="text-sm text-red-600 text-center"></p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";
const auth = getAuth(initializeApp(firebaseConfig)), $ = (i) => document.getElementById(i);
const next = new URLSearchParams(location.search).get("next") || "index.html";
const errs = { "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة", "auth/email-already-in-use": "البريد مستخدم من قبل", "auth/weak-password": "كلمة المرور ضعيفة", "auth/invalid-email": "بريد غير صالح", "auth/operation-not-allowed": "فعّل Email/Password من Firebase Console" };
const run = (fn) => async () => { $("msg").textContent = ""; try { await fn(); } catch (e) { $("msg").textContent = errs[e.code] || e.message; } };
$("login").onclick = run(async () => { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); location.replace(next); });
$("register").onclick = run(async () => { await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); location.replace(next); });
$("reset").onclick = run(async () => { await sendPasswordResetEmail(auth, $("email").value.trim()); $("msg").className = "text-sm text-green-600 text-center"; $("msg").textContent = "أُرسل رابط الاستعادة إلى بريدك"; });
</script></body></html>
