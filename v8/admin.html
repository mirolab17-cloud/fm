<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين</title><link rel="stylesheet" href="app.css"></head><body data-require="admin"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,h,$,members,fail,toast,confirmUI,inputUI,db,collection,getDocs,doc,setDoc,updateDoc,addDoc,serverTimestamp}from"./app.js";const S=await boot();async function idHash(v){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(v||"").replace(/\s/g,"")));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}const ROLES={pending:"بانتظار الموافقة",viewer:"مشاهد",editor:"محرر",admin:"مدير"},PAGES={"events.html":"الأحداث","statistics.html":"الإحصائيات","family_tree.html":"الشجرة","export_data.html":"التصدير","mukhtars.html":"المخاتير"};async function run(){const all=await members(),main=$("main"),users=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()}));main.innerHTML=`<div class="top"><div><h1>👥 إدارة الأعضاء</h1><p class="mut">الموافقة، الرفض، إيقاف الحساب، وربط العضو بالصلاحيات المناسبة.</p></div><div class="row"><a class="btn" href="activity.html">سجل النشاط</a><a class="btn" href="statistics.html">الإحصائيات</a></div></div><div class="stats"><div class="stat"><b>${users.length}</b><span class="mut">كل الحسابات</span></div><div class="stat"><b>${users.filter(u=>u.role==="pending").length}</b><span class="mut">طلبات معلقة</span></div><div class="stat"><b>${users.filter(u=>u.disabled).length}</b><span class="mut">حسابات موقوفة</span></div></div><div class="panel"><div class="top"><h2>الحسابات والطلبات</h2><input id="q" style="max-width:300px" placeholder="بحث بالاسم أو البريد أو الهوية"></div><div class="tw"><table><thead><tr><th>العضو</th><th>الحالة</th><th>ربط العائلة</th><th>الدور</th><th>صلاحيات الصفحات</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;const tb=$("#rows");function draw(){const q=$("#q").value.trim().toLowerCase();tb.replaceChildren(...users.filter(u=>!q||[u.email,u.displayName,u.idNumber,u.phoneNumber].join(" ").toLowerCase().includes(q)).map(u=>{const tr=h("tr"),data=h("td"),status=h("td"),link=h("td"),role=h("td"),per=h("td"),act=h("td");data.innerHTML=`<b>${u.displayName||"بدون اسم"}</b><div class="mut">${u.email||"—"}<br>${u.phoneNumber||"—"}<br>هوية: ${u.idNumber||"—"}<br>الأم: ${u.motherName||"—"}</div>`;status.innerHTML=`<span class="tag ${u.disabled?"no":u.role==="pending"?"warn":"ok"}">${u.disabled?"موقوف":ROLES[u.role]||"غير معروف"}</span>`;const sel=h("select");sel.add(new Option("— لا يوجد ربط —",""));all.slice().sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||"","ar")).forEach(p=>sel.add(new Option(p.fullName||p.firstName,p.id)));sel.value=u.personId||"";link.appendChild(sel);const rs=h("select");Object.entries(ROLES).forEach(([k,v])=>rs.add(new Option(v,k)));rs.value=u.role||"pending";role.appendChild(rs);const pp=h("div");Object.entries(PAGES).forEach(([k,v])=>{const l=h("label","chk",v);l.style.cssText="display:inline-flex;margin:2px;font-size:11px";const c=document.createElement("input");c.type="checkbox";c.value=k;c.checked=(u.permissions||[]).includes(k);l.prepend(c);pp.appendChild(l)});const branch=document.createElement("input");branch.placeholder="فروع مسموحة، مفصولة بفاصلة";branch.value=(u.branchPermissions||[]).join(", ");branch.style.marginTop="5px";pp.appendChild(branch);per.appendChild(pp);const save=h("button","btn gold","حفظ"),reject=h("button","btn red","طلب تعديل/رفض"),toggle=h("button","btn",u.disabled?"إعادة تفعيل":"إيقاف");save.onclick=async()=>{try{if(rs.value==="admin"&&!await confirmUI("تأكيد الصلاحية","هل تريد منح هذا الحساب صلاحية المدير؟"))return;const permissions=[...pp.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),branches=branch.value.split(",").map(x=>x.trim()).filter(Boolean);if(u.idNumber)await setDoc(doc(db,"loginIndex",await idHash(u.idNumber)),{uid:u.id,email:u.email,updatedAt:serverTimestamp()},{merge:true});await updateDoc(doc(db,"users",u.id),{role:rs.value,personId:sel.value||null,permissions,branchPermissions:branches,disabled:false,verificationStatus:rs.value==="pending"?"pending":"approved",approvedAt:rs.value==="pending"?null:serverTimestamp(),approvedBy:S.user.uid});await addDoc(collection(db,"auditLogs"),{type:"user-permissions-approval",targetUid:u.id,role:rs.value,permissions,branches,by:S.user.uid,at:serverTimestamp()});Object.assign(u,{role:rs.value,personId:sel.value||null,permissions,branchPermissions:branches,disabled:false});toast("تم الحفظ والموافقة ✓");draw()}catch(e){fail(e)}};reject.onclick=async()=>{const reason=await inputUI("طلب تعديل البيانات","اكتب سبب الرفض أو البيانات المطلوبة",u.rejectionReason||"");if(reason===null)return;try{await updateDoc(doc(db,"users",u.id),{role:"pending",verificationStatus:"needs-update",rejectionReason:reason});u.role="pending";u.rejectionReason=reason;toast("تم إرسال سبب التعديل للعضو");draw()}catch(e){fail(e)}};toggle.onclick=async()=>{try{await updateDoc(doc(db,"users",u.id),{disabled:!u.disabled});u.disabled=!u.disabled;toast(u.disabled?"تم إيقاف الحساب":"تمت إعادة تفعيل الحساب");draw()}catch(e){fail(e)}};act.append(save,reject,toggle);tr.append(data,status,link,role,per,act);return tr}));}$("#q").oninput=draw;draw()}run().catch(fail);
</script></body></html>
