<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أماكن انتشار العائلة</title><link rel="stylesheet" href="app.css"></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,fail,shellTitle,branch}from'./family-pages.js';const S=await boot();async function run(){const all=await members(),main=$('main');main.innerHTML=shellTitle('أماكن انتشار العائلة','تجميع الأماكن من حقول الموقع/المدينة/المنطقة الموجودة في ملفات الأشخاص.');const keys=['city','location','placeOfBirth','birthPlace','residence','address'];const map=new Map();all.forEach(m=>{let p=null;for(const k of keys){if(m[k]){p=typeof m[k]==='string'?m[k]:m[k].name;break}}if(p)map.set(p,(map.get(p)||[]).concat(m))});const box=h('section','place-grid');main.append(box);if(!map.size){box.innerHTML='<div class="panel empty"><div class="empty-icon">🗺️</div><h2>لا توجد أماكن منظمة بعد</h2><p>عند إضافة المدينة أو مكان الميلاد أو السكن إلى بيانات الأشخاص ستظهر هنا.</p></div>';return}for(const [place,people] of [...map.entries()].sort((a,b)=>b[1].length-a[1].length)){const c=h('article','place-card');c.innerHTML=`<div class="map-pin">📍</div><div><h2>${place}</h2><p>${people.length} فرد · ${[...new Set(people.flatMap(x=>x.allTags||x.tags||[]))].slice(0,3).join('، ')||'بدون فرع'}</p></div><details><summary>عرض الأشخاص</summary><div class="mini-list"></div></details>`;const list=c.querySelector('.mini-list');people.slice(0,12).forEach(m=>{const a=h('a','mini-person');a.href='profile.html?id='+m.id;a.textContent=m.fullName||m.firstName;list.append(a)});box.append(c)}}run().catch(fail);
</script></body></html>
