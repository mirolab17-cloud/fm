<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17233b"><title>إدارة المستخدمين والأجهزة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body data-require="admin"><main class="page"><div class="empty">جاري تحميل لوحة الإدارة…</div></main><script type="module">
import{boot,h,$,members,fail,toast,confirmUI,inputUI,db,collection,getDocs,doc,setDoc,updateDoc,addDoc,serverTimestamp,increment,collectionGroup,query,orderBy,limit,revokeDevice,adminLogoutUser}from'./app.js';
const S=await boot();
const ROLES={pending:'بانتظار الموافقة',viewer:'مشاهد',editor:'محرر',admin:'مدير'};
const PAGES={'events.html':'الأحداث','statistics.html':'الإحصائيات','family_tree.html':'الشجرة','export_data.html':'التصدير','mukhtars.html':'المخاتير'};
const cutoff=()=>Date.now()-3*60*1000;
async function idHash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(v||'').replace(/\s/g,'')));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function run(){
 const all=await members();
 const users=(await getDocs(collection(db,'users'))).docs.map(d=>({id:d.id,...d.data()}));
 const deviceSnap=await getDocs(query(collectionGroup(db,'devices'),orderBy('lastSeenAt','desc'),limit(500))).catch(async()=>await getDocs(collectionGroup(db,'devices')));
 const devices=deviceSnap.docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,parentPath:d.ref.path,...d.data()}));
 const main=$('main');
 main.innerHTML=`<div class="top"><div><span class="eyebrow">لوحة الإدارة والأمان</span><h1>👥 إدارة المستخدمين والأجهزة</h1><p class="mut">راقب الأعضاء النشطين، الأجهزة المتصلة، وطلبات الحسابات من مكان واحد.</p></div><div class="row"><a class="btn" href="activity.html">🧾 سجل النشاط</a><a class="btn" href="statistics.html">📊 الإحصائيات</a></div></div>
 <div class="stats"><div class="stat"><b id="totalUsers">0</b><span class="mut">كل الحسابات</span></div><div class="stat"><b id="pendingUsers">0</b><span class="mut">طلبات معلقة</span></div><div class="stat"><b id="activeUsers">0</b><span class="mut">أعضاء نشطون</span></div><div class="stat"><b id="activeDevices">0</b><span class="mut">أجهزة نشطة</span></div></div>
 <div class="admin-tabs"><button class="btn admin-tab active" data-tab="users">👥 الحسابات</button><button class="btn admin-tab" data-tab="active">🟢 الأعضاء النشطون</button><button class="btn admin-tab" data-tab="devices">📱 الأجهزة</button></div>
 <section id="usersTab"><div class="panel"><div class="top"><div><h2>الحسابات والطلبات</h2><p class="mut">الموافقة والربط وإدارة الأدوار والصلاحيات.</p></div><input id="q" style="max-width:340px" placeholder="بحث بالاسم أو البريد أو الهوية"></div><div id="userCards"></div></div></section>
 <section id="activeTab" hidden><div class="panel"><div class="top"><div><h2>🟢 الأعضاء النشطون الآن</h2><p class="mut">يُعتبر العضو نشطًا إذا ظهر جهازه خلال آخر 3 دقائق.</p></div><button class="btn" id="refresh">↻ تحديث</button></div><div id="activeList" class="security-grid"></div></div></section>
 <section id="devicesTab" hidden><div class="panel"><div class="top"><div><h2>📱 إدارة الأجهزة</h2><p class="mut">يمكنك إزالة جهاز، أو تسجيل خروج عضو من جميع أجهزته.</p></div><button class="btn" id="refresh2">↻ تحديث</button></div><div id="deviceList" class="security-grid"></div></div></section>`;
 const userCards=$('#userCards'), activeList=$('#activeList'), deviceList=$('#deviceList');
 const getUser=uid=>users.find(u=>u.id===uid)||{};
 function active(d){return !d.revoked&&((d.lastSeenAt?.toMillis?.()||0)>=cutoff())}
 function drawStats(){
   const au=users.filter(u=>devices.some(d=>d.uid===u.id&&active(d))).length; const ad=devices.filter(active).length;
   $('#totalUsers').textContent=users.length;$('#pendingUsers').textContent=users.filter(u=>u.role==='pending').length;$('#activeUsers').textContent=au;$('#activeDevices').textContent=ad;
 }
 function drawUsers(){
   const q=($('#q').value||'').trim().toLowerCase(); userCards.replaceChildren();
   const list=users.filter(u=>!q||[u.email,u.displayName,u.idNumber,u.phoneNumber,u.motherName].join(' ').toLowerCase().includes(q));
   if(!list.length){userCards.innerHTML='<div class="security-empty">لا توجد نتائج.</div>';return}
   list.forEach(u=>{
     const wrap=h('div','panel'); const activeCount=devices.filter(d=>d.uid===u.id&&active(d)).length;
     wrap.innerHTML=`<div class="member-security"><div><b>${esc(u.displayName||'بدون اسم')}</b><div class="mut">${esc(u.email||'—')} · ${esc(u.phoneNumber||'—')}</div><div class="presence">${activeCount?'<span class="online-dot"></span> متصل من '+activeCount+' جهاز':'<span class="offline-dot"></span> غير متصل الآن'}</div></div><div><span class="tag ${u.disabled?'no':u.role==='pending'?'':'ok'}">${u.disabled?'موقوف':esc(ROLES[u.role]||'غير معروف')}</span><div class="mut small">آخر دخول: ${u.lastLoginAt?.toDate?u.lastLoginAt.toDate().toLocaleString('ar-EG'):'—'}</div></div><div class="row"><button class="btn red logout-user">🚪 تسجيل خروج</button><button class="btn toggle-user">${u.disabled?'تفعيل':'إيقاف'}</button></div></div><div class="g"><div><label class="l">ربط الشخص</label><select class="person"></select></div><div><label class="l">الدور</label><select class="role"></select></div><div><label class="l">الفروع المسموحة</label><input class="branches" placeholder="فرع، فرع آخر" value="${esc((u.branchPermissions||[]).join(', '))}"></div></div><div class="permissions"></div><div class="row" style="margin-top:10px"><button class="btn gold save-user">حفظ التعديلات</button><button class="btn reject-user">طلب تعديل البيانات</button><a class="btn" href="activity.html">السجل</a></div>`;
     const person=wrap.querySelector('.person');person.add(new Option('— لا يوجد ربط —',''));all.slice().sort((a,b)=>(a.fullName||'').localeCompare(b.fullName||'','ar')).forEach(p=>person.add(new Option(p.fullName||p.firstName,p.id)));person.value=u.personId||'';
     const rs=wrap.querySelector('.role');Object.entries(ROLES).forEach(([k,v])=>rs.add(new Option(v,k)));rs.value=u.role||'pending';
     const pp=wrap.querySelector('.permissions');Object.entries(PAGES).forEach(([k,v])=>{const l=h('label','chk',v);l.style.cssText='display:inline-flex;margin:3px;font-size:11px';const c=document.createElement('input');c.type='checkbox';c.checked=(u.permissions||[]).includes(k);l.prepend(c);c.dataset.page=k;pp.append(l)});
     wrap.querySelector('.save-user').onclick=async()=>{try{if(rs.value==='admin'&&!await confirmUI('تأكيد الصلاحية','هل تريد منح هذا الحساب صلاحية المدير؟'))return;const permissions=[...pp.querySelectorAll('input:checked')].map(x=>x.dataset.page),branches=wrap.querySelector('.branches').value.split(',').map(x=>x.trim()).filter(Boolean);if(u.idNumber)await setDoc(doc(db,'loginIndex',await idHash(u.idNumber)),{uid:u.id,email:u.email,updatedAt:serverTimestamp()},{merge:true});await updateDoc(doc(db,'users',u.id),{role:rs.value,personId:person.value||null,permissions,branchPermissions:branches,disabled:false,verificationStatus:rs.value==='pending'?'pending':'approved',approvedAt:rs.value==='pending'?null:serverTimestamp(),approvedBy:S.user.uid});Object.assign(u,{role:rs.value,personId:person.value||null,permissions,branchPermissions:branches,disabled:false});await addDoc(collection(db,'auditLogs'),{type:'user-permissions-approval',targetUid:u.id,role:rs.value,permissions,branches,by:S.user.uid,at:serverTimestamp()});toast('تم الحفظ ✓');drawUsers();drawStats()}catch(e){fail(e)}};
     wrap.querySelector('.reject-user').onclick=async()=>{const reason=await inputUI('طلب تعديل البيانات','اكتب السبب أو البيانات المطلوبة',u.rejectionReason||'');if(reason===null)return;try{await updateDoc(doc(db,'users',u.id),{role:'pending',verificationStatus:'needs-update',rejectionReason:reason});u.role='pending';u.rejectionReason=reason;toast('تم إرسال طلب التعديل');drawUsers();drawStats()}catch(e){fail(e)}};
     wrap.querySelector('.toggle-user').onclick=async()=>{try{const next=!u.disabled;await updateDoc(doc(db,'users',u.id),{disabled:next,sessionVersion:increment(1),logoutRequestedAt:serverTimestamp()});u.disabled=next;toast(next?'تم إيقاف الحساب وتسجيل خروجه':'تمت إعادة تفعيل الحساب');drawUsers();drawStats()}catch(e){fail(e)}};
     wrap.querySelector('.logout-user').onclick=async()=>{if(u.id===S.user.uid){toast('لا يمكنك تسجيل خروج نفسك من هذه اللوحة');return}if(!await confirmUI('تسجيل خروج العضو','سيتم تسجيل خروج العضو من جميع الأجهزة المفتوحة لديه.',true))return;try{await adminLogoutUser(u.id);toast('تم طلب تسجيل الخروج من جميع أجهزته ✓');drawUsers()}catch(e){fail(e)}};
     userCards.append(wrap);
   });
 }
 function deviceCard(d){const u=getUser(d.uid), online=active(d), icon=d.type==='mobile'?'📱':d.type==='tablet'?'📲':'💻';const el=h('article','security-card');el.innerHTML=`<div class="device-line"><div class="device-icon">${icon}</div><div class="device-meta"><b>${esc(u.displayName||d.email||'عضو')}</b><small>${esc(d.deviceName||'جهاز غير معروف')}</small><small>${online?'<span class="online-dot"></span> متصل الآن':'<span class="offline-dot"></span> غير متصل'} · ${d.lastSeenAt?.toDate?d.lastSeenAt.toDate().toLocaleString('ar-EG'):'—'}</small></div></div><div class="mut small" style="margin-top:8px">${esc(d.browser||'')} · ${esc(d.platform||'')} · ${esc(d.id.slice(0,8))}</div><div class="device-actions"><button class="btn red revoke">🗑️ إزالة الجهاز</button><button class="btn logout">🚪 خروج العضو</button></div>`;el.querySelector('.revoke').onclick=async()=>{if(!await confirmUI('إزالة الجهاز','سيتم إيقاف جلسة هذا الجهاز فورًا.',true))return;try{await revokeDevice(d.uid,d.id);d.revoked=true;d.active=false;toast('تمت إزالة الجهاز ✓');drawDevices();drawStats()}catch(e){fail(e)}};el.querySelector('.logout').onclick=async()=>{if(!await confirmUI('تسجيل خروج العضو','سيتم تسجيل خروج العضو من جميع أجهزته.',true))return;try{await adminLogoutUser(d.uid);toast('تم تسجيل الخروج من جميع الأجهزة ✓')}catch(e){fail(e)}};return el}
 function drawDevices(){deviceList.replaceChildren(...devices.filter(d=>!d.revoked).map(deviceCard));if(!deviceList.children.length)deviceList.innerHTML='<div class="security-empty">لا توجد أجهزة مسجلة بعد.</div>';activeList.replaceChildren(...devices.filter(active).map(deviceCard));if(!activeList.children.length)activeList.innerHTML='<div class="security-empty">لا يوجد أعضاء نشطون الآن.</div>';drawStats()}
 $('#q').oninput=drawUsers;document.querySelectorAll('.admin-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['users','active','devices'].forEach(t=>$('#'+t+'Tab').hidden=t!==b.dataset.tab);if(b.dataset.tab!=='users')drawDevices()});$('#refresh').onclick=()=>location.reload();$('#refresh2').onclick=()=>location.reload();drawUsers();drawDevices();
}
run().catch(fail);
</script></body></html>
