<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صلة القرابة</title><link rel="stylesheet" href="app.css"></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,nm,yr,fail,pcard,branch,shellTitle}from'./family-pages.js';const S=await boot();
async function run(){const all=await members(),main=$('main');main.innerHTML=shellTitle('اكتشف صلة القرابة','اختر شخصين وسنحاول إيجاد أقصر مسار عائلي بينهما.');const panel=h('section','panel relationship-box');panel.innerHTML='<div class="g"><label class="l">الشخص الأول<select id="a"></select></label><label class="l">الشخص الثاني<select id="b"></select></label></div><div class="row"><button class="btn gold" id="go">🧬 احسب صلة القرابة</button><button class="btn" id="swap">تبديل</button></div><div id="out" class="relation-result empty">اختر شخصين للبدء.</div>';main.append(panel);const opts=all.slice().sort((a,b)=>nm(a).localeCompare(nm(b),'ar')).map(m=>`<option value="${m.id}">${nm(m)} · ${yr(m.birthDate)||'؟'} · ${branch(m)}</option>`);$('#a').innerHTML='<option value="">اختر…</option>'+opts.join('');$('#b').innerHTML='<option value="">اختر…</option>'+opts.join('');
function parents(m){return [m.fatherId,m.motherId].filter(Boolean)}function path(from,to){const adj=new Map(all.map(m=>[m.id,[]]));all.forEach(m=>{parents(m).forEach(p=>{if(adj.has(p)){adj.get(m.id).push(p);adj.get(p).push(m.id)}});(m.spouseIds||[]).forEach(s=>{if(adj.has(s)){adj.get(m.id).push(s);adj.get(s).push(m.id)}})});const q=[from],prev=new Map([[from,null]]);while(q.length){const x=q.shift();if(x===to)break;for(const y of new Set(adj.get(x)||[])){if(!prev.has(y)){prev.set(y,x);q.push(y)}}}if(!prev.has(to))return null;const p=[];for(let x=to;x!==null;x=prev.get(x))p.push(x);return p.reverse()}
$('#swap').onclick=()=>{const x=$('#a').value;$('#a').value=$('#b').value;$('#b').value=x};$('#go').onclick=()=>{const a=all.find(m=>m.id===$('#a').value),b=all.find(m=>m.id===$('#b').value);if(!a||!b)return;const ids=path(a.id,b.id),out=$('#out');if(!ids){out.className='relation-result empty';out.textContent='لم أجد مسارًا مرتبطًا بالبيانات الحالية. قد تحتاج لإضافة الأب/الأم أو الزوج/الزوجة.';return}out.className='relation-result';out.innerHTML=`<div class="relation-head"><strong>${nm(a)}</strong><span>↔</span><strong>${nm(b)}</strong></div><div class="relation-path"></div><p class="mut">عدد الروابط في المسار: ${ids.length-1}</p>`;const rp=out.querySelector('.relation-path');ids.forEach((id,i)=>{const m=all.find(x=>x.id===id),c=h('a','relation-node');c.href='profile.html?id='+id;c.innerHTML=`<span>${i+1}</span><b>${nm(m)}</b><small>${branch(m)}</small>`;rp.appendChild(c);if(i<ids.length-1)rp.appendChild(h('i','', '↓'))})};}
run().catch(fail);
</script></body></html>
