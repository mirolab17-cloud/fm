<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي</title><link rel="stylesheet" href="app.css"></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,h,$,fail,toast,db,doc,getDoc,updateDoc,serverTimestamp,auth}from"./app.js";const S=await boot();async function run(){const p=(await getDoc(doc(db,"users",S.user.uid))).data()||{},main=$("main");main.innerHTML=`<div class="top"><h1>👤 حسابي</h1><a href="index.html">الرئيسية</a></div><div class="panel"><div class="tag ${p.role==='pending'?'warn':'ok'}">${p.role==='pending'?'طلبك بانتظار مراجعة المدير':'الحساب مفعل'}</div>${p.rejectionReason?`<p class="err">سبب طلب التعديل أو الرفض: ${p.rejectionReason}</p>`:''}<form id="f" class="g"><div><label class="l">الاسم</label><input id="n" value="${p.displayName||''}"></div><div><label class="l">رقم الجوال</label><input id="ph" dir="ltr" value="${p.phoneNumber||''}"></div><div><label class="l">اسم الأم</label><input id="mo" value="${p.motherName||''}"></div><div><label class="l">رقم الهوية</label><input id="idn" dir="ltr" value="${p.idNumber||''}"></div><div><label class="l">تاريخ الميلاد</label><input id="bd" type="date" value="${p.birthDate||''}"></div><div style="grid-column:1/-1"><label class="chk"><input id="consent" type="checkbox" required> أوافق على <a href="privacy.html">سياسة الخصوصية</a></label></div><button class="btn gold" type="submit">حفظ طلب التعديل</button></form></div>`;$("#f").onsubmit=async e=>{e.preventDefault();try{await updateDoc(doc(db,"users",S.user.uid),{displayName:$("#n").value.trim(),phoneNumber:$("#ph").value.trim(),motherName:$("#mo").value.trim(),idNumber:$("#idn").value.trim(),birthDate:$("#bd").value,verificationStatus:"pending",role:"pending",lastLoginAt:serverTimestamp()});toast("تم تحديث الطلب وإعادته للمراجعة ✓")}catch(e){fail(e)}}}run().catch(fail);
</script></body></html>
