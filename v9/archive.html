<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أرشيف العائلة</title><link rel="stylesheet" href="app.css"></head><body data-require="viewer"><main class="page"><div class="empty">جاري التحميل…</div></main><script type="module">
import{boot,members,h,$,fail,shellTitle,db,collection,getDocs,esc}from'./family-pages.js';const S=await boot();async function run(){const main=$('main');main.innerHTML=shellTitle('أرشيف العائلة','صور ووثائق وروايات قابلة للتوسع مع نمو المشروع.');const type=new URLSearchParams(location.search).get('type')||'photo';const tabs=h('div','archive-tabs');[['photo','📸 الصور'],['document','📄 الوثائق'],['story','🎙️ الروايات']].forEach(([v,t])=>{const a=h('a',v===type?'on':'',t);a.href='archive.html?type='+v;tabs.append(a)});main.append(tabs);let docs=[];try{const col=type==='story'?'familyStories':'familyMedia';docs=(await getDocs(collection(db,col))).docs.map(d=>({id:d.id,...d.data()})).filter(x=>type==='story'||(x.type||'photo')===type)}catch(e){}if(type==='photo'&&!docs.length){const all=await members();docs=all.filter(m=>m.photoUrl||m.photoURL).map(m=>({type:'photo',title:m.fullName||m.firstName,url:m.photoUrl||m.photoURL,personId:m.id,createdAt:m.createdAt}))}const box=h('section','panel');main.append(box);if(!docs.length){box.innerHTML=`<div class="empty"><div class="empty-icon">${type==='photo'?'📸':type==='document'?'📄':'🎙️'}</div><h2>لا يوجد محتوى بعد</h2><p>عند إضافة عناصر إلى مجموعة <b>familyMedia</b> أو <b>familyStories</b> ستظهر هنا.</p></div>`;return}if(type==='photo'){const wall=h('div','photo-wall');docs.forEach(x=>{const a=h('a','photo-tile');a.href=x.personId?'profile.html?id='+x.personId:(x.url||'#');a.innerHTML=`<img src="${esc(x.url||'')}" alt=""><span>${esc(x.title||'صورة عائلية')}</span>`;wall.append(a)});box.append(wall)}else{const list=h('div','archive-list');docs.forEach(x=>{const a=h('article','archive-item');a.innerHTML=`<div class="archive-icon">${type==='document'?'📄':'🎙️'}</div><div><h3>${esc(x.title||x.name||'عنصر من الأرشيف')}</h3><p>${esc(x.description||x.text||'لا يوجد وصف.')}</p>${x.url?`<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">فتح الملف</a>`:''}</div>`;list.append(a)});box.append(list)}}run().catch(fail);
</script></body></html>
